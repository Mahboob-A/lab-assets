<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1240" height="480" fill="#F8FAFC" rx="16"/>
  <rect x="1" y="1" width="1238" height="478" fill="none" stroke="#E2E8F0" stroke-width="2" rx="16"/>

  <!-- Diagram Title Header -->
  <text x="620" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Information Retrieval Evaluation Engine Pipeline (Cranfield Paradigm)</text>
  <text x="620" y="58" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">Evaluating Search Engine Output Against Human Ground-Truth Judgments via Standardized IR Metrics</text>

  <!-- ============================================================== -->
  <!-- 1. LEFT COLUMN: EVALUATION INPUTS                              -->
  <!-- ============================================================== -->

  <!-- Input 1: Search Engine Output -->
  <g filter="url(#shadow)">
    <rect x="45" y="95" width="280" height="175" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="45" y="95" width="280" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 45 119 H 325 V 129 H 45 Z" fill="#DBEAFE"/>
    <text x="60" y="117" font-size="12" font-weight="700" fill="#1E40AF">1. Engine Ranked Results</text>
    <rect x="235" y="102" width="80" height="18" fill="#2563EB" rx="4"/>
    <text x="275" y="115" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Retrieved</text>

    <text x="60" y="147" font-size="10.5" font-weight="700" fill="#1E293B">Ordered List of Top-K Hits:</text>
    <text x="60" y="167" font-size="9.5" fill="#64748B">• Rank 1: DocID = 1 (Score: 5.77)</text>
    <text x="60" y="183" font-size="9.5" fill="#64748B">• Rank 2: DocID = 3 (Score: 2.83)</text>
    <text x="60" y="199" font-size="9.5" fill="#64748B">• Rank 3: DocID = 9 (Score: 2.50)</text>
    <rect x="60" y="215" width="250" height="42" fill="#EFF6FF" stroke="#BFDBFE" rx="6"/>
    <text x="70" y="232" font-size="9" font-weight="700" fill="#1E40AF">System Output Vector R(Q)</text>
    <text x="70" y="247" font-size="8.5" fill="#64748B">Captured with nanosecond execution latency</text>
  </g>

  <!-- Input 2: Ground-Truth Judgments -->
  <g filter="url(#shadow)">
    <rect x="45" y="285" width="280" height="175" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="45" y="285" width="280" height="34" fill="#D1FAE5" rx="10"/>
    <path d="M 45 309 H 325 V 319 H 45 Z" fill="#D1FAE5"/>
    <text x="60" y="307" font-size="12" font-weight="700" fill="#065F46">2. Ground-Truth Judgments</text>
    <rect x="235" y="292" width="80" height="18" fill="#059669" rx="4"/>
    <text x="275" y="305" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Annotated</text>

    <text x="60" y="337" font-size="10.5" font-weight="700" fill="#1E293B">Human-Curated Relevance:</text>
    <text x="60" y="357" font-size="9.5" fill="#64748B">• Seed file: relevance_judgments.json</text>
    <text x="60" y="373" font-size="9.5" fill="#64748B">• 6 benchmark queries annotated</text>
    <text x="60" y="389" font-size="9.5" fill="#64748B">• Binary relevance: rel(Doc) ∈ {0, 1}</text>
    <rect x="60" y="405" width="250" height="42" fill="#ECFDF5" stroke="#A7F3D0" rx="6"/>
    <text x="70" y="422" font-size="9" font-weight="700" fill="#065F46">Cranfield Evaluation Standard</text>
    <text x="70" y="437" font-size="8.5" fill="#64748B">Objective benchmark against known gold standard</text>
  </g>

  <!-- Connectors: Inputs -> Evaluation Engine -->
  <path d="M 325 180 L 375 220" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 325 180 L 370 220" class="base-line flow-blue"/>

  <path d="M 325 370 L 375 330" class="base-line" stroke="#A7F3D0" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 325 370 L 370 330" class="base-line flow-green"/>

  <!-- ============================================================== -->
  <!-- 2. CENTER COLUMN: IR METRICS COMPUTATION (evaluator.py)        -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="375" y="95" width="490" height="365" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" rx="10"/>
    <rect x="375" y="95" width="490" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 375 119 H 865 V 129 H 375 Z" fill="#F1F5F9"/>
    <text x="390" y="117" font-size="13" font-weight="700" fill="#0F172A">SearchEvaluator Engine (evaluator.py)</text>
    <rect x="745" y="102" width="110" height="20" fill="#0F172A" rx="4"/>
    <text x="800" y="116" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">Formulas Computed</text>

    <!-- Metric 1: Precision@k -->
    <rect x="390" y="140" width="460" height="65" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="400" y="158" font-size="11" font-weight="700" fill="#1E40AF">1. Precision@k = (Count of relevant docs in top k) / k</text>
    <text x="400" y="176" font-size="9.5" fill="#334155">• Evaluates viewport purity: of the top k items seen by user, how many are good?</text>
    <text x="400" y="192" font-size="9" fill="#64748B">• P@1 measures the first impression; P@3 measures top-3 viewport relevance.</text>

    <!-- Metric 2: Recall@k -->
    <rect x="390" y="215" width="460" height="65" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="400" y="233" font-size="11" font-weight="700" fill="#1E40AF">2. Recall@k = (Count of relevant docs in top k) / (Total relevant in corpus)</text>
    <text x="400" y="251" font-size="9.5" fill="#334155">• Evaluates global coverage: what fraction of all known relevant docs did we retrieve?</text>
    <text x="400" y="267" font-size="9" fill="#64748B">• Counterbalances precision: prevents systems from hiding poor coverage.</text>

    <!-- Metric 3: Reciprocal Rank -->
    <rect x="390" y="290" width="460" height="65" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="400" y="308" font-size="11" font-weight="700" fill="#059669">3. Reciprocal Rank (RR) = 1 / rank_of_first_relevant_doc</text>
    <text x="400" y="326" font-size="9.5" fill="#334155">• Models "time to first satisfaction": rank 1 gives 1.0; rank 2 gives 0.5; rank 4 gives 0.25</text>
    <text x="400" y="342" font-size="9" fill="#64748B">• Rewards systems that nail the very first document click.</text>

    <!-- Metric 4: Average Precision -->
    <rect x="390" y="365" width="460" height="82" fill="#ECFDF5" stroke="#A7F3D0" rx="6"/>
    <text x="400" y="383" font-size="11" font-weight="700" fill="#047857">4. Average Precision (AP) = (1 / |Relevant|) * ∑ (Precision@k * rel(k))</text>
    <text x="400" y="401" font-size="9.5" fill="#047857">• Calculates precision at each position where a relevant document appears</text>
    <text x="400" y="417" font-size="9" fill="#334155">• Gold standard metric: heavily penalizes algorithms that bury relevant results.</text>
    <text x="400" y="433" font-size="9" fill="#059669">• Macro-averaged across queries to produce Mean Average Precision (MAP).</text>
  </g>

  <!-- Connector: Evaluator -> Macro Report -->
  <path d="M 865 275 L 910 275" class="base-line" stroke="#A7F3D0" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 865 275 L 905 275" class="base-line flow-green"/>

  <!-- ============================================================== -->
  <!-- 3. RIGHT COLUMN: MACRO AGGREGATION & REPORT EXPORT             -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="910" y="95" width="285" height="365" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="910" y="95" width="285" height="34" fill="#D1FAE5" rx="10"/>
    <path d="M 910 119 H 1195 V 129 H 910 Z" fill="#D1FAE5"/>
    <text x="925" y="117" font-size="12" font-weight="700" fill="#065F46">3. Macro Benchmark Metrics</text>
    <rect x="1105" y="102" width="80" height="18" fill="#059669" rx="4"/>
    <text x="1145" y="115" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Aggregated</text>

    <!-- Mean Average Precision (MAP) -->
    <rect x="925" y="145" width="255" height="90" fill="#ECFDF5" stroke="#A7F3D0" rx="8"/>
    <text x="935" y="167" font-size="11" font-weight="700" fill="#047857">Mean Average Precision (MAP)</text>
    <text x="935" y="187" font-size="9" fill="#334155">• Macro-average of AP across 6 queries</text>
    <text x="935" y="203" font-size="9" fill="#059669">• ES English: MAP = 0.8472 (Dominant)</text>
    <text x="935" y="219" font-size="9" fill="#DC2626">• Homemade: MAP = 0.4167 (AND drops)</text>

    <!-- Mean Reciprocal Rank (MRR) -->
    <rect x="925" y="245" width="255" height="90" fill="#EFF6FF" stroke="#BFDBFE" rx="8"/>
    <text x="935" y="267" font-size="11" font-weight="700" fill="#1E40AF">Mean Reciprocal Rank (MRR)</text>
    <text x="935" y="287" font-size="9" fill="#334155">• Macro-average of RR across 6 queries</text>
    <text x="935" y="303" font-size="9" fill="#059669">• ES English: MRR = 1.0000 (100% P@1!)</text>
    <text x="935" y="319" font-size="9" fill="#64748B">• Homemade: MRR = 0.5000 (3 queries miss)</text>

    <!-- Export Files -->
    <rect x="925" y="345" width="255" height="100" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/>
    <text x="935" y="367" font-size="10.5" font-weight="700" fill="#1E293B">Persisted Benchmark Outputs:</text>
    <text x="935" y="387" font-size="9" fill="#2563EB">✔ comparison_report.json</text>
    <text x="935" y="403" font-size="9" fill="#64748B">  (Structured test data &amp; latencies)</text>
    <text x="935" y="421" font-size="9" fill="#059669">✔ shootout_results.txt</text>
    <text x="935" y="437" font-size="9" fill="#64748B">  (Human-readable summary scorecard)</text>
  </g>
</svg>