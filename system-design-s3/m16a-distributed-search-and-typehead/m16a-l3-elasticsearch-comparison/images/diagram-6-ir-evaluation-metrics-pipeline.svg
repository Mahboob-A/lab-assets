<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .card-header-blue { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; }
      .card-header-green { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.5; }
      .card-header-slate { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 19px; fill: #0F172A; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .bold-text { font-weight: 600; fill: #1E293B; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="540" class="bg"/>

  <!-- Main Canvas Card Frame -->
  <rect x="20" y="20" width="940" height="500" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Title Banner -->
  <text x="490" y="52" text-anchor="middle" class="title-text">Information Retrieval Metrics Pipeline: The Cranfield Evaluation Framework</text>
  <text x="490" y="73" text-anchor="middle" class="subtitle-text">Mathematical evaluation of ranked results: Precision@k, Recall@k, Reciprocal Rank, and MAP</text>

  <!-- Input Bar -->
  <g transform="translate(50, 90)">
    <rect width="880" height="42" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" rx="6"/>
    <text x="15" y="26" class="bold-text" font-size="11.5" fill="#1E293B">Query: <tspan fill="#2563EB" font-family="ui-monospace">"replicating cache nodes"</tspan></text>
    <text x="310" y="26" class="mono-text" fill="#047857">Ground Truth Relevant: {Doc 1, Doc 8, Doc 9}</text>
    <text x="615" y="26" class="mono-text" fill="#1E40AF">Retrieved: [Doc 1, Doc 8, Doc 5]</text>
  </g>

  <!-- ============================================================== -->
  <!-- 4 INDIVIDUAL METRIC CARDS                                      -->
  <!-- ============================================================== -->

  <!-- Card 1: Precision@k -->
  <g transform="translate(50, 142)">
    <rect width="205" height="210" class="card" stroke="#3B82F6"/>
    <path d="M 0 8 Q 0 0 8 0 L 197 0 Q 205 0 205 8 L 205 26 L 0 26 Z" class="card-header-blue"/>
    <text x="102" y="18" text-anchor="middle" class="bold-text" fill="#1E40AF" font-size="11">1. PRECISION@K (P@K)</text>

    <text x="12" y="44" class="bold-text" font-size="10.5">Viewport Purity</text>
    <text x="12" y="60" class="mono-text" fill="#2563EB">P@k = |Hits ∩ Rel| / k</text>

    <!-- Calculation box -->
    <rect x="10" y="74" width="185" height="88" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="18" y="94" class="mono-text">• Top-1: [Doc 1 (Rel)]</text>
    <text x="26" y="110" class="badge-text" fill="#059669">P@1 = 1 / 1 = 1.0000</text>
    <text x="18" y="130" class="mono-text">• Top-3: [D1, D8 (Rel), D5]</text>
    <text x="26" y="146" class="badge-text" fill="#059669">P@3 = 2 / 3 = 0.6667</text>

    <rect x="10" y="170" width="185" height="30" fill="#EFF6FF" stroke="#3B82F6" rx="4"/>
    <text x="102" y="189" text-anchor="middle" class="badge-text" fill="#1E40AF">Focus: Top-Slot Cleanliness</text>
  </g>

  <!-- Card 2: Recall@k -->
  <g transform="translate(275, 142)">
    <rect width="205" height="210" class="card" stroke="#10B981"/>
    <path d="M 0 8 Q 0 0 8 0 L 197 0 Q 205 0 205 8 L 205 26 L 0 26 Z" class="card-header-green"/>
    <text x="102" y="18" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">2. RECALL@K (R@K)</text>

    <text x="12" y="44" class="bold-text" font-size="10.5">Corpus Coverage</text>
    <text x="12" y="60" class="mono-text" fill="#059669">R@k = |Hits ∩ Rel| / |Rel|</text>

    <!-- Calculation box -->
    <rect x="10" y="74" width="185" height="88" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="18" y="94" class="mono-text">• Total Relevant = 3 docs</text>
    <text x="18" y="112" class="mono-text">• Retrieved: Docs 1 &amp; 8</text>
    <text x="18" y="132" class="mono-text">• Missing: Doc 9</text>
    <text x="26" y="148" class="badge-text" fill="#059669">R@3 = 2 / 3 = 0.6667</text>

    <rect x="10" y="170" width="185" height="30" fill="#ECFDF5" stroke="#10B981" rx="4"/>
    <text x="102" y="189" text-anchor="middle" class="badge-text" fill="#065F46">Focus: Global Recall Depth</text>
  </g>

  <!-- Card 3: Reciprocal Rank -->
  <g transform="translate(500, 142)">
    <rect width="205" height="210" class="card" stroke="#64748B"/>
    <path d="M 0 8 Q 0 0 8 0 L 197 0 Q 205 0 205 8 L 205 26 L 0 26 Z" class="card-header-slate"/>
    <text x="102" y="18" text-anchor="middle" class="bold-text" fill="#334155" font-size="11">3. RECIPROCAL RANK (RR)</text>

    <text x="12" y="44" class="bold-text" font-size="10.5">First Relevant Position</text>
    <text x="12" y="60" class="mono-text" fill="#334155">RR = 1 / first_rel_rank</text>

    <!-- Calculation box -->
    <rect x="10" y="74" width="185" height="88" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="18" y="94" class="mono-text">• Rank 1: Doc 1 (Relevant!)</text>
    <text x="18" y="112" class="mono-text">• first_rank = 1</text>
    <text x="18" y="132" class="mono-text">• Calculation: 1 / 1</text>
    <text x="26" y="148" class="badge-text" fill="#1E293B">RR = 1.0000</text>

    <rect x="10" y="170" width="185" height="30" fill="#F1F5F9" stroke="#64748B" rx="4"/>
    <text x="102" y="189" text-anchor="middle" class="badge-text" fill="#334155">Focus: Searcher Time-to-Answer</text>
  </g>

  <!-- Card 4: Average Precision -->
  <g transform="translate(725, 142)">
    <rect width="205" height="210" class="card" stroke="#3B82F6"/>
    <path d="M 0 8 Q 0 0 8 0 L 197 0 Q 205 0 205 8 L 205 26 L 0 26 Z" class="card-header-blue"/>
    <text x="102" y="18" text-anchor="middle" class="bold-text" fill="#1E40AF" font-size="11">4. AVERAGE PRECISION (AP)</text>

    <text x="12" y="44" class="bold-text" font-size="10.5">Precision-Recall Area</text>
    <text x="12" y="60" class="mono-text" fill="#2563EB">AP = Σ (P@k * rel_k) / |Rel|</text>

    <!-- Calculation box -->
    <rect x="10" y="74" width="185" height="88" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="14" y="94" class="mono-text">• P@1 * 1 = 1.00 * 1 = 1.0</text>
    <text x="14" y="112" class="mono-text">• P@2 * 1 = 1.00 * 1 = 1.0</text>
    <text x="14" y="132" class="mono-text">• P@3 * 0 = 0.67 * 0 = 0.0</text>
    <text x="22" y="148" class="badge-text" fill="#059669">AP = (1.0+1.0+0)/3 = 0.6667</text>

    <rect x="10" y="170" width="185" height="30" fill="#EFF6FF" stroke="#3B82F6" rx="4"/>
    <text x="102" y="189" text-anchor="middle" class="badge-text" fill="#1E40AF">Focus: Entire Ranking Curve</text>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM MACRO EVALUATION: MAP & MRR SCORECARD                   -->
  <!-- ============================================================== -->
  <g transform="translate(50, 362)">
    <rect width="880" height="142" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="8"/>
    <text x="20" y="24" class="bold-text" font-size="12" fill="#1E40AF">Macro Evaluation: Aggregating Across the Full 6-Query Benchmark Suite (|Q| = 6)</text>

    <!-- Formula Columns -->
    <g transform="translate(20, 38)">
      <!-- Left: MAP -->
      <g transform="translate(0, 0)">
        <rect width="410" height="65" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
        <text x="12" y="20" class="bold-text" font-size="11" fill="#1E293B">Mean Average Precision (MAP):</text>
        <text x="12" y="38" class="mono-text">MAP = (1 / |Q|) * Σ AP_q across all 6 queries</text>
        <text x="12" y="54" class="badge-text" fill="#059669">• Elasticsearch (English): MAP = 0.8472</text>
        <text x="250" y="54" class="badge-text" fill="#DC2626">• Custom: MAP = 0.4167</text>
      </g>

      <!-- Right: MRR -->
      <g transform="translate(430, 0)">
        <rect width="410" height="65" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
        <text x="12" y="20" class="bold-text" font-size="11" fill="#1E293B">Mean Reciprocal Rank (MRR):</text>
        <text x="12" y="38" class="mono-text">MRR = (1 / |Q|) * Σ RR_q across all 6 queries</text>
        <text x="12" y="54" class="badge-text" fill="#059669">• Elasticsearch (English): MRR = 1.0000</text>
        <text x="250" y="54" class="badge-text" fill="#DC2626">• Custom: MRR = 0.5000</text>
      </g>
    </g>

    <!-- Summary sentence -->
    <text x="20" y="125" class="body-text" font-weight="600" fill="#1E40AF">Empirical Takeaway: MRR = 1.0000 confirms that Elasticsearch returns an authoritative relevant document at Rank 1 in 100% of queries.</text>
  </g>
</svg>
