<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .card-header-blue { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; }
      .card-header-green { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.5; }
      .card-header-red { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5; }
      .card-header-slate { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 19px; fill: #0F172A; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .bold-text { font-weight: 600; fill: #1E293B; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; }
      .flow-line-red { stroke: #DC2626; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .flow-line-green { stroke: #059669; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .solid-line { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="540" class="bg"/>

  <!-- Main Canvas Card Frame -->
  <rect x="20" y="20" width="940" height="500" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Title Banner -->
  <text x="490" y="52" text-anchor="middle" class="title-text">Text Analysis Pipeline: Regex Tokenizer vs. Multi-Field Analyzers</text>
  <text x="490" y="73" text-anchor="middle" class="subtitle-text">Why simple character tokenizers suffer morphological blindness and how multi-fields achieve 100% precision</text>

  <!-- Input Query Bar -->
  <g transform="translate(50, 92)">
    <rect width="880" height="42" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" rx="6"/>
    <text x="15" y="26" class="bold-text" font-size="12" fill="#1E293B">Benchmark Query A1: <tspan fill="#2563EB" font-family="ui-monospace">"replicating cache nodes"</tspan></text>
    <text x="490" y="26" class="subtitle-text">Target: <tspan fill="#059669" font-weight="600">Doc 1 ("Distributed Caching with Redis Replication")</tspan></text>
  </g>

  <!-- ============================================================== -->
  <!-- LEFT COLUMN: FIRST PRINCIPLES REGEX TOKENIZER                  -->
  <!-- ============================================================== -->
  <g transform="translate(50, 145)">
    <rect width="425" height="270" class="card" stroke="#EF4444"/>
    <path d="M 0 8 Q 0 0 8 0 L 417 0 Q 425 0 425 8 L 425 26 L 0 26 Z" class="card-header-red"/>
    <text x="212" y="18" text-anchor="middle" class="bold-text" fill="#991B1B" font-size="11">1. FIRST PRINCIPLES REGEX TOKENIZER (analyzer.py)</text>

    <!-- Sub-step 1: Token Generation -->
    <g transform="translate(15, 38)">
      <rect width="395" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#991B1B">Token Extraction: \b[a-zA-Z0-9_-]+\b</text>
      <text x="12" y="34" class="body-text">Lowercased query terms:</text>
      <text x="12" y="50" class="mono-text" fill="#2563EB">["replicating", "cache", "nodes"]</text>
    </g>

    <!-- Sub-step 2: String Equality Match -->
    <g transform="translate(15, 108)">
      <rect width="395" height="74" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#991B1B">Posting Match against Doc 1 Index:</text>
      <text x="12" y="34" class="mono-text">Doc 1 terms: ["redis", "caching", "replication"]</text>
      <text x="12" y="52" class="mono-text" fill="#DC2626">"replicating" == "replication"  ──▶ FALSE</text>
      <text x="12" y="68" class="subtitle-text">Exact string mismatch: Missing morphological root</text>
    </g>

    <!-- Sub-step 3: Failure Outcome -->
    <g transform="translate(15, 192)">
      <rect width="395" height="66" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" rx="6"/>
      <text x="12" y="22" class="bold-text" font-size="11" fill="#991B1B">[RETRIEVAL CLIFF] Hits Returned: 0 Docs</text>
      <text x="12" y="40" class="body-text">Two-pointer Boolean AND fails completely because Doc 1</text>
      <text x="12" y="56" class="badge-text" fill="#DC2626">lacks exact literal term "replicating". Precision@1 = 0.00</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT COLUMN: ELASTICSEARCH MULTI-FIELD PIPELINE               -->
  <!-- ============================================================== -->
  <g transform="translate(505, 145)">
    <rect width="425" height="270" class="card" stroke="#10B981"/>
    <path d="M 0 8 Q 0 0 8 0 L 417 0 Q 425 0 425 8 L 425 26 L 0 26 Z" class="card-header-green"/>
    <text x="212" y="18" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">2. ELASTICSEARCH MULTI-FIELD PIPELINE (es_client.py)</text>

    <!-- Sub-step 1: Multi-Field Breakdown -->
    <g transform="translate(15, 38)">
      <rect width="395" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#065F46">Multi-Field Analyzers for 'content':</text>
      <text x="12" y="34" class="mono-text">• content (standard): ["replicating", "cache", "nodes"]</text>
      <text x="12" y="50" class="mono-text" fill="#059669">• content.english (Porter): ["replic", "cach", "node"]</text>
    </g>

    <!-- Sub-step 2: Stemmed Match -->
    <g transform="translate(15, 108)">
      <rect width="395" height="74" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#065F46">Morphological Stem Matching:</text>
      <text x="12" y="34" class="mono-text">Doc 1 "replication" Porter stems ──▶ "replic"</text>
      <text x="12" y="52" class="mono-text" fill="#059669">"replic" == "replic"  ──▶ TRUE (STEM MATCH!)</text>
      <text x="12" y="68" class="subtitle-text">Matches morphological stem across grammatical variations</text>
    </g>

    <!-- Sub-step 3: Success Outcome -->
    <g transform="translate(15, 192)">
      <rect width="395" height="66" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" rx="6"/>
      <text x="12" y="22" class="bold-text" font-size="11" fill="#065F46">[SURFACES DOC 1] Rank 1 | BM25 Score: 3.105</text>
      <text x="12" y="40" class="body-text">English analyzer matches Doc 1 at Rank 1 and Doc 8 at Rank 2.</text>
      <text x="12" y="56" class="badge-text" fill="#059669">Survives vocabulary mismatch! Precision@1 = 1.0000 (100%)</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM TAKEAWAY: MULTI-FIELD STRATEGY                          -->
  <!-- ============================================================== -->
  <g transform="translate(50, 427)">
    <rect width="880" height="78" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="8"/>
    <text x="15" y="22" class="bold-text" font-size="12" fill="#1E40AF">Production Engineering Principle: The Multi-Field Advantage</text>
    <text x="15" y="42" class="body-text">• One Field, Multiple Indexes: Elasticsearch maps the same JSON text attribute into standard, stemmed (english), and exact hyphen tokenizers simultaneously.</text>
    <text x="15" y="60" class="body-text">• Eliminating Trade-offs: Exact compound phrases ("in-memory") retain exact ranking via content.exact, while flexible queries enjoy 100% recall via content.english.</text>
  </g>
</svg>
