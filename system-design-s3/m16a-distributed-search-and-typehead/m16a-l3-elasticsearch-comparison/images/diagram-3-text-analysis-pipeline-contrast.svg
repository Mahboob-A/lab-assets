<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 480" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1220" height="480" fill="#F8FAFC" rx="16"/>
  <rect x="1" y="1" width="1218" height="478" fill="none" stroke="#E2E8F0" stroke-width="2" rx="16"/>

  <!-- Diagram Title Header -->
  <text x="610" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Text Analysis Pipeline: Custom Regex vs. Lucene Multi-Fields</text>
  <text x="610" y="56" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">How Linguistic Normalization Directly Determines Information Retrieval Precision &amp; Recall</text>

  <!-- Raw Input Text Box -->
  <g filter="url(#shadow)">
    <rect x="50" y="75" width="1120" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="8"/>
    <text x="70" y="96" font-size="11" font-weight="700" fill="#64748B">RAW INPUT TEXT STREAM:</text>
    <text x="70" y="115" font-size="12.5" font-family="monospace" font-weight="700" fill="#0F172A">"The &lt;div&gt;replicating&lt;/div&gt; in-memory cache nodes achieve high throughput"</text>
    <rect x="1040" y="87" width="110" height="26" fill="#F1F5F9" rx="6"/>
    <text x="1095" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Source String</text>
  </g>

  <!-- Split Connectors Downward -->
  <path d="M 350 127 L 350 160" class="base-line" stroke="#A7F3D0" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 350 127 L 350 155" class="base-line flow-green"/>

  <path d="M 870 127 L 870 160" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 870 127 L 870 155" class="base-line flow-blue"/>

  <!-- ============================================================== -->
  <!-- TRACK A: HOMEMADE REGEX TOKENIZER (LEFT)                       -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="165" width="530" height="285" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="50" y="165" width="530" height="34" fill="#D1FAE5" rx="10"/>
    <path d="M 50 189 H 580 V 199 H 50 Z" fill="#D1FAE5"/>
    <text x="65" y="187" font-size="12" font-weight="700" fill="#065F46">Track A: Custom Python TextAnalyzer (Single Pipeline)</text>
    <rect x="480" y="172" width="85" height="18" fill="#059669" rx="4"/>
    <text x="522" y="185" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">analyzer.py</text>

    <!-- Pipeline Steps -->
    <rect x="65" y="210" width="500" height="42" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="75" y="227" font-size="10" font-weight="700" fill="#1E293B">Regex Word Boundary Tokenization:</text>
    <text x="75" y="243" font-size="9.5" font-family="monospace" fill="#059669">\b[a-zA-Z0-9_-]+\b (Hyphens treated as internal word chars)</text>

    <rect x="65" y="260" width="500" height="56" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="75" y="278" font-size="10" font-weight="700" fill="#1E293B">Resulting Inverted Tokens:</text>
    <text x="75" y="296" font-size="10.5" font-family="monospace" font-weight="700" fill="#1E3A8A">['replicating', 'in-memory', 'cache', 'nodes', 'achieve', 'high', 'throughput']</text>
    <text x="75" y="309" font-size="8.5" fill="#64748B">(Stopwords 'the' discarded. HTML '&lt;div&gt;' stripped by regex boundaries)</text>

    <!-- Verdict -->
    <rect x="65" y="326" width="500" height="110" fill="#ECFDF5" stroke="#A7F3D0" rx="6"/>
    <text x="75" y="346" font-size="10.5" font-weight="700" fill="#065F46">Architectural Strengths &amp; Blindspots:</text>
    <text x="75" y="366" font-size="9" fill="#047857">✔ Preserves compound phrases: "in-memory" indexed as single atomic token</text>
    <text x="75" y="382" font-size="9" fill="#047857">✔ Query B1 ("in-memory key-value") matches Doc 1 with 100% precision</text>
    <text x="75" y="402" font-size="9" fill="#DC2626">❌ Complete linguistic blindness: No morphological stemming</text>
    <text x="75" y="418" font-size="9" fill="#DC2626">❌ Query A1 ("replicating") completely misses corpus word "replication" (0 hits!)</text>
  </g>

  <!-- ============================================================== -->
  <!-- TRACK B: ELASTICSEARCH MULTI-FIELD PIPELINE (RIGHT)            -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="620" y="165" width="550" height="285" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="620" y="165" width="550" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 620 189 H 1170 V 199 H 620 Z" fill="#DBEAFE"/>
    <text x="635" y="187" font-size="12" font-weight="700" fill="#1E40AF">Track B: Elasticsearch Multi-Field Indexing (Parallel Pipelines)</text>
    <rect x="1070" y="172" width="85" height="18" fill="#2563EB" rx="4"/>
    <text x="1112" y="185" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">es_client.py</text>

    <!-- Subfield 1: Standard -->
    <rect x="635" y="210" width="520" height="65" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="645" y="226" font-size="10" font-weight="700" fill="#1E293B">1. Field: content (Standard Unicode UAX #29)</text>
    <text x="645" y="242" font-size="9.5" font-family="monospace" fill="#475569">['the', 'replicating', 'in', 'memory', 'cache', 'nodes', ...]</text>
    <text x="645" y="258" font-size="8.5" fill="#64748B">Splits punctuation. Treats "in" and "memory" as separate tokens.</text>

    <!-- Subfield 2: English Porter Stemmer -->
    <rect x="635" y="285" width="520" height="75" fill="#EFF6FF" stroke="#BFDBFE" rx="6"/>
    <text x="645" y="301" font-size="10" font-weight="700" fill="#1E40AF">2. Field: content.english (Porter Stemmer + Stopwords)</text>
    <text x="645" y="318" font-size="10" font-family="monospace" font-weight="700" fill="#047857">['replic', 'in', 'memori', 'cach', 'node', 'achiev', 'high', 'throughput']</text>
    <text x="645" y="334" font-size="8.5" fill="#059669">✔ Morphological Root: "replicating" ──▶ "replic" (Matches corpus "replication"!)</text>
    <text x="645" y="348" font-size="8.5" fill="#1E40AF">Dominates Query A1, A2, and A3, elevating English to 100% P@1 &amp; MAP = 0.8472.</text>

    <!-- Subfield 3: Exact Hyphen Regex -->
    <rect x="635" y="370" width="520" height="66" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="645" y="386" font-size="10" font-weight="700" fill="#1E293B">3. Field: content.exact (Custom Hyphen Pattern Regex)</text>
    <text x="645" y="403" font-size="9.5" font-family="monospace" fill="#059669">['in-memory'] (Preserves exact technical compounds)</text>
    <text x="645" y="419" font-size="8.5" fill="#64748B">Multi-fields eliminate trade-offs: queries can target exact, stemmed, or both!</text>
  </g>
</svg>