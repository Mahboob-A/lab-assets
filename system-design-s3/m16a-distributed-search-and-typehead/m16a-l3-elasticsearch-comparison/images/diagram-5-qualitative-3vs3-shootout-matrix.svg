<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1240" height="520" fill="#F8FAFC" rx="16"/>
  <rect x="1" y="1" width="1238" height="518" fill="none" stroke="#E2E8F0" stroke-width="2" rx="16"/>

  <!-- Diagram Title Header -->
  <text x="620" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">The 3 vs 3 Benchmark Decision Matrix: Root-Cause Architectural Drivers</text>
  <text x="620" y="58" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">Explaining the Specific Architectural Strengths and Blindspots Behind Every Benchmark Outcome</text>

  <!-- ============================================================== -->
  <!-- LEFT COLUMN: CATEGORY A — ELASTICSEARCH WINS                   -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="45" y="85" width="560" height="405" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="45" y="85" width="560" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 45 109 H 605 V 119 H 45 Z" fill="#DBEAFE"/>
    <text x="60" y="107" font-size="13" font-weight="700" fill="#1E40AF">Category A: Elasticsearch Industrial Wins</text>
    <rect x="445" y="92" width="150" height="20" fill="#2563EB" rx="4"/>
    <text x="520" y="106" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">100% P@1 | MAP = 0.8472</text>

    <!-- Row A1 -->
    <rect x="60" y="130" width="530" height="75" fill="#EFF6FF" stroke="#BFDBFE" rx="8"/>
    <text x="75" y="150" font-size="11" font-weight="700" fill="#1E40AF">A1: Morphological Stemming ("replicating cache nodes")</text>
    <text x="75" y="168" font-size="9.5" fill="#334155">• Root Cause: Porter Stemmer collapses "replicating" ──▶ root "replic"</text>
    <text x="75" y="184" font-size="9.5" fill="#059669">✔ Matches corpus word "replication" in Doc 1 &amp; 8. (Homemade returns 0 hits!)</text>

    <!-- Row A2 -->
    <rect x="60" y="215" width="530" height="75" fill="#EFF6FF" stroke="#BFDBFE" rx="8"/>
    <text x="75" y="235" font-size="11" font-weight="700" fill="#1E40AF">A2: Disjunctive Retrieval ("redis cache clustering and sharding")</text>
    <text x="75" y="253" font-size="9.5" fill="#334155">• Root Cause: Match query evaluates union (OR) with WAND dynamic pruning</text>
    <text x="75" y="269" font-size="9.5" fill="#059669">✔ Surfaces Doc 1 (Score: 5.77) and Doc 3 (Score: 2.83). (Boolean AND drops both!)</text>

    <!-- Row A3 -->
    <rect x="60" y="300" width="530" height="75" fill="#EFF6FF" stroke="#BFDBFE" rx="8"/>
    <text x="75" y="320" font-size="11" font-weight="700" fill="#1E40AF">A3: Stopwords &amp; IDF ("how to achieve consensus across servers")</text>
    <text x="75" y="338" font-size="9.5" fill="#334155">• Root Cause: English analyzer strips conversational noise ('how', 'to', 'across')</text>
    <text x="75" y="354" font-size="9.5" fill="#059669">✔ Heavily weights rare keyword "consensus", placing Raft (Doc 2) at Rank #1.</text>

    <!-- Summary Box -->
    <rect x="60" y="385" width="530" height="90" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="75" y="405" font-size="10" font-weight="700" fill="#1E293B">Key Architectural Takeaway:</text>
    <text x="75" y="422" font-size="9" fill="#64748B">Real users submit messy, conversational, multi-word queries. Industrial search</text>
    <text x="75" y="437" font-size="9" fill="#64748B">engines rely on morphological stemming and disjunctive matching to guarantee</text>
    <text x="75" y="452" font-size="9" fill="#059669">high recall and prevent empty search result pages.</text>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT COLUMN: CATEGORY B — HOMEMADE PROTOTYPE WINS             -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="635" y="85" width="560" height="405" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="635" y="85" width="560" height="34" fill="#D1FAE5" rx="10"/>
    <path d="M 635 109 H 1195 V 119 H 635 Z" fill="#D1FAE5"/>
    <text x="650" y="107" font-size="13" font-weight="700" fill="#065F46">Category B: First Principles Prototype Wins</text>
    <rect x="1035" y="92" width="150" height="20" fill="#059669" rx="4"/>
    <text x="1110" y="106" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">RAM Speed: 0.05ms</text>

    <!-- Row B1 -->
    <rect x="650" y="130" width="530" height="75" fill="#ECFDF5" stroke="#A7F3D0" rx="8"/>
    <text x="665" y="150" font-size="11" font-weight="700" fill="#065F46">B1: Hyphen Compound Terms ("in-memory key-value")</text>
    <text x="665" y="168" font-size="9.5" fill="#334155">• Root Cause: Custom regex keeps "in-memory" and "key-value" atomic</text>
    <text x="665" y="184" font-size="9.5" fill="#047857">✔ Matches Doc 1 with 100% precision. (Standard analyzer splits into 4 words!)</text>

    <!-- Row B2 -->
    <rect x="650" y="215" width="530" height="75" fill="#ECFDF5" stroke="#A7F3D0" rx="8"/>
    <text x="665" y="235" font-size="11" font-weight="700" fill="#065F46">B2: Small-Corpus IDF Separation ("scatter-gather")</text>
    <text x="665" y="253" font-size="9.5" fill="#334155">• Root Cause: Unquantized 64-bit IEEE 754 float math maintains sharp scoring</text>
    <text x="665" y="269" font-size="9.5" fill="#047857">✔ High score separation on rare terms. (Lucene quantizes length norms to 1 byte!)</text>

    <!-- Row B3 -->
    <rect x="650" y="300" width="530" height="75" fill="#ECFDF5" stroke="#A7F3D0" rx="8"/>
    <text x="665" y="320" font-size="11" font-weight="700" fill="#065F46">B3: Microsecond Execution Latency ("raft consensus leader election")</text>
    <text x="665" y="338" font-size="9.5" fill="#334155">• Root Cause: In-process RAM traversal directly inside CPU L1/L2 hardware caches</text>
    <text x="665" y="354" font-size="9.5" fill="#047857">✔ Runs in 0.05ms (115x faster than Elasticsearch's 5.73ms HTTP REST round-trip!)</text>

    <!-- Summary Box -->
    <rect x="650" y="385" width="530" height="90" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="665" y="405" font-size="10" font-weight="700" fill="#1E293B">Key Architectural Takeaway:</text>
    <text x="665" y="422" font-size="9" fill="#64748B">When an embedded dataset fits entirely in memory, a custom inverted index</text>
    <text x="665" y="437" font-size="9" fill="#64748B">delivers microsecond performance with zero network, serialization, or JVM</text>
    <text x="665" y="452" font-size="9" fill="#047857">operational overhead.</text>
  </g>
</svg>