<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropGlow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrBlue2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrAmber2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#10b981"/>
    </marker>
    <marker id="arrRose2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#f43f5e"/>
    </marker>

    <!-- Styles -->
    <style>
      .flow-blue2 {
        stroke: #3b82f6;
        stroke-width: 2.2;
        stroke-dasharray: 6 4;
        animation: flow2 1.6s linear infinite;
        fill: none;
      }
      .flow-amber2 {
        stroke: #f59e0b;
        stroke-width: 2.2;
        stroke-dasharray: 6 4;
        animation: flow2 1.6s linear infinite;
        fill: none;
      }
      .flow-green2 {
        stroke: #10b981;
        stroke-width: 2.2;
        stroke-dasharray: 6 4;
        animation: flow2 1.6s linear infinite;
        fill: none;
      }
      .flow-rose2 {
        stroke: #f43f5e;
        stroke-width: 2.2;
        stroke-dasharray: 6 4;
        animation: flow2 1.6s linear infinite;
        fill: none;
      }
      .static-line2 {
        stroke: #475569;
        stroke-width: 1.5;
        fill: none;
      }
      @keyframes flow2 {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Title Card -->
  <rect x="30" y="20" width="1160" height="60" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#dropGlow2)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#3b82f6"/>
  <text x="55" y="45" fill="#f8fafc" font-size="18" font-weight="700">The Near-Real-Time (NRT) Lifecycle, Translog &amp; Background Segment Merges</text>
  <text x="55" y="65" fill="#94a3b8" font-size="12">From In-Memory Buffer to Searchable OS Page Cache, Translog fsync, and TieredMergePolicy Compaction</text>
  <rect x="1030" y="35" width="145" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="1102" y="53" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">Lucene Ingestion Path</text>

  <!-- STEP 1: Ingestion & Dual Writes (Top Left) -->
  <rect x="30" y="100" width="360" height="260" rx="12" fill="url(#cardGrad2)" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropGlow2)"/>
  <rect x="45" y="115" width="330" height="28" rx="5" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
  <text x="210" y="134" fill="#bfdbfe" font-size="12" font-weight="700" text-anchor="middle">STAGE 1: DUAL-WRITE INGESTION</text>

  <!-- Box 1A: RAM Buffer -->
  <rect x="45" y="155" width="330" height="85" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="60" y="177" fill="#60a5fa" font-size="12" font-weight="700">1. Indexing RAM Buffer</text>
  <text x="60" y="197" fill="#94a3b8" font-size="10.5">DocumentsWriterPerThread (DWPT)</text>
  <text x="60" y="215" fill="#cbd5e1" font-size="10">Analyzes and accumulates inverted index in RAM</text>
  <text x="60" y="230" fill="#f87171" font-size="9.5" font-weight="600">INVISIBLE to IndexSearcher until Refresh!</text>

  <!-- Box 1B: Translog -->
  <rect x="45" y="255" width="330" height="85" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="60" y="277" fill="#fbbf24" font-size="12" font-weight="700">2. Translog (Transaction Log)</text>
  <text x="60" y="297" fill="#94a3b8" font-size="10.5">Append-only disk write on primary &amp; replicas</text>
  <text x="60" y="315" fill="#cbd5e1" font-size="10">Guarantees durability if node crashes mid-flight</text>
  <text x="60" y="330" fill="#fde68a" font-size="9.5">Replayed during cluster crash recovery</text>

  <!-- STEP 2: The NRT Refresh Gate (Top Right) -->
  <rect x="430" y="100" width="360" height="260" rx="12" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5" filter="url(#dropGlow2)"/>
  <rect x="445" y="115" width="330" height="28" rx="5" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="610" y="134" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle">STAGE 2: THE NRT REFRESH GATE</text>

  <!-- Box 2A: Segment Write to OS Page Cache -->
  <rect x="445" y="155" width="330" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="460" y="177" fill="#34d399" font-size="12" font-weight="700">Write to OS Page Cache</text>
  <text x="460" y="197" fill="#94a3b8" font-size="10.5">Flushes RAM buffer into new immutable segment</text>
  <text x="460" y="215" fill="#cbd5e1" font-size="10">Segment is held in kernel page cache (not disk fsync)</text>
  <text x="460" y="230" fill="#6ee7b7" font-size="9.5" font-weight="600">Extremely fast: avoids heavy disk I/O cost</text>

  <!-- Box 2B: Reader Reopen -->
  <rect x="445" y="255" width="330" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="460" y="277" fill="#34d399" font-size="12" font-weight="700">Reopen IndexSearcher</text>
  <text x="460" y="297" fill="#94a3b8" font-size="10.5">Point-in-time directory reader sees new segment</text>
  <text x="460" y="315" fill="#cbd5e1" font-size="10">Default interval: 1000ms (1 second)</text>
  <text x="460" y="330" fill="#a7f3d0" font-size="9.5" font-family="monospace">Explicit: client.indices.refresh(index)</text>

  <!-- STEP 3: Flush & Commit (Right Column) -->
  <rect x="830" y="100" width="360" height="260" rx="12" fill="url(#cardGrad2)" stroke="#f59e0b" stroke-width="1.5" filter="url(#dropGlow2)"/>
  <rect x="845" y="115" width="330" height="28" rx="5" fill="#78350f" stroke="#d97706" stroke-width="1"/>
  <text x="1010" y="134" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">STAGE 3: FLUSH &amp; COMMIT (DURABILITY)</text>

  <!-- Box 3A: fsync to Disk -->
  <rect x="845" y="155" width="330" height="85" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="860" y="177" fill="#fbbf24" font-size="12" font-weight="700">Physical fsync to Disk</text>
  <text x="860" y="197" fill="#94a3b8" font-size="10.5">Executes Lucene two-phase commit</text>
  <text x="860" y="215" fill="#cbd5e1" font-size="10">All kernel page cache buffers forced to storage</text>
  <text x="860" y="230" fill="#fde68a" font-size="9.5">Interval: 30 minutes or 512MB threshold</text>

  <!-- Box 3B: Commit Point & Truncation -->
  <rect x="845" y="255" width="330" height="85" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="860" y="277" fill="#fbbf24" font-size="12" font-weight="700">Commit Point &amp; Translog Truncate</text>
  <text x="860" y="297" fill="#94a3b8" font-size="10.5">Writes 'segments_N' file containing segment list</text>
  <text x="860" y="315" fill="#cbd5e1" font-size="10">Translog emptied because data is safely persistent</text>
  <text x="860" y="330" fill="#60a5fa" font-size="9.5">Clean checkpoint established</text>

  <!-- STEP 4: Segment Merges & .del Bitmap Reclamation (Bottom Area) -->
  <rect x="30" y="380" width="1160" height="295" rx="14" fill="url(#cardGrad2)" stroke="#a855f7" stroke-width="1.8" filter="url(#dropGlow2)"/>
  <rect x="45" y="395" width="1130" height="30" rx="5" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
  <text x="610" y="415" fill="#f3e8ff" font-size="13" font-weight="700" text-anchor="middle">STAGE 4: BACKGROUND SEGMENT MERGES (TieredMergePolicy &amp; .del Tombstone Purging)</text>

  <!-- Small Segments Before Merge -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="75" y="25" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">Segment _0</text>
    <text x="75" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">1,000 docs</text>
    <rect x="15" y="65" width="120" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="81" fill="#cbd5e1" font-size="10" text-anchor="middle">Size: 2.1 MB</text>
    <rect x="15" y="100" width="120" height="35" rx="4" fill="#3f121a" stroke="#f43f5e" stroke-width="1"/>
    <text x="75" y="115" fill="#fda4af" font-size="9" text-anchor="middle">.del bitmap: 200 docs</text>
    <text x="75" y="128" fill="#f87171" font-size="8.5" text-anchor="middle">(20% deleted)</text>
  </g>

  <g transform="translate(230, 440)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="75" y="25" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">Segment _1</text>
    <text x="75" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">1,200 docs</text>
    <rect x="15" y="65" width="120" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="81" fill="#cbd5e1" font-size="10" text-anchor="middle">Size: 2.5 MB</text>
    <rect x="15" y="100" width="120" height="35" rx="4" fill="#3f121a" stroke="#f43f5e" stroke-width="1"/>
    <text x="75" y="115" fill="#fda4af" font-size="9" text-anchor="middle">.del bitmap: 120 docs</text>
    <text x="75" y="128" fill="#f87171" font-size="8.5" text-anchor="middle">(10% deleted)</text>
  </g>

  <g transform="translate(400, 440)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="75" y="25" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">Segment _2</text>
    <text x="75" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">800 docs</text>
    <rect x="15" y="65" width="120" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="81" fill="#cbd5e1" font-size="10" text-anchor="middle">Size: 1.8 MB</text>
    <rect x="15" y="100" width="120" height="35" rx="4" fill="#3f121a" stroke="#f43f5e" stroke-width="1"/>
    <text x="75" y="115" fill="#fda4af" font-size="9" text-anchor="middle">.del bitmap: 280 docs</text>
    <text x="75" y="128" fill="#f87171" font-size="8.5" text-anchor="middle">(35% deleted)</text>
  </g>

  <!-- Merge Engine Box (Center) -->
  <g transform="translate(580, 440)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="110" y="25" fill="#c084fc" font-size="11.5" font-weight="700" text-anchor="middle">TieredMergePolicy</text>
    <text x="110" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">ConcurrentMergeScheduler</text>
    <line x1="20" y1="58" x2="200" y2="58" stroke="#475569" stroke-width="1"/>
    <text x="20" y="80" fill="#e2e8f0" font-size="9.5">* Logarithmic staircase tiers</text>
    <text x="20" y="98" fill="#e2e8f0" font-size="9.5">* Sorts segments by size</text>
    <text x="20" y="116" fill="#e2e8f0" font-size="9.5">* Sequential streaming merge</text>
    <text x="20" y="134" fill="#f43f5e" font-size="9.5" font-weight="600">* Skips deleted doc records</text>
  </g>

  <!-- Merged New Segment (Right) -->
  <g transform="translate(835, 440)">
    <rect x="0" y="0" width="190" height="150" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.8"/>
    <text x="95" y="25" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle">Merged Segment _3</text>
    <text x="95" y="45" fill="#cbd5e1" font-size="10" text-anchor="middle">2,400 Active Documents</text>
    <rect x="20" y="60" width="150" height="26" rx="4" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="95" y="77" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Final Size: 5.1 MB</text>
    <rect x="20" y="95" width="150" height="42" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="95" y="112" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle">600 Deleted Docs Purged</text>
    <text x="95" y="127" fill="#a7f3d0" font-size="9" text-anchor="middle">Disk space 100% reclaimed</text>
  </g>

  <!-- Old Segments Trashed -->
  <g transform="translate(1055, 440)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="60" y="30" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">Old Segments</text>
    <text x="60" y="45" fill="#64748b" font-size="9" text-anchor="middle">_0, _1, _2</text>
    <circle cx="60" cy="85" r="24" fill="#3f121a" stroke="#f43f5e" stroke-width="1.5"/>
    <path d="M 48 73 L 72 97 M 72 73 L 48 97" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="60" y="130" fill="#f87171" font-size="9.5" font-weight="600" text-anchor="middle">Unlinked &amp; Deleted</text>
  </g>

  <!-- Flow Arrows -->
  <!-- Stage 1 RAM to Stage 2 OS Page Cache -->
  <path d="M 375 197 L 445 197" class="flow-green2" marker-end="url(#arrGreen2)"/>
  <!-- Stage 1 Translog to Stage 3 fsync -->
  <path d="M 375 297 C 410 297, 410 370, 820 370 C 820 370, 835 370, 845 297" class="flow-amber2" marker-end="url(#arrAmber2)"/>
  <!-- Stage 2 to Stage 4 (Searchable segments ready to merge) -->
  <path d="M 610 340 L 610 380" class="flow-blue2" marker-end="url(#arrBlue2)"/>
  <!-- Small Segments to Merge Engine -->
  <path d="M 550 515 L 580 515" class="flow-blue2" marker-end="url(#arrBlue2)"/>
  <!-- Merge Engine to Merged Segment -->
  <path d="M 800 515 L 835 515" class="flow-green2" marker-end="url(#arrGreen2)"/>
  <!-- Merged Segment to Old Segments Unlink -->
  <path d="M 1025 515 L 1055 515" class="flow-rose2" marker-end="url(#arrRose2)"/>
</svg>
