<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1260" height="520" fill="#F8FAFC" rx="16"/>
  <rect x="1" y="1" width="1258" height="518" fill="none" stroke="#E2E8F0" stroke-width="2" rx="16"/>

  <!-- Diagram Title Header -->
  <text x="630" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Near-Real-Time (NRT) Segment Lifecycle, Translog &amp; Tiered Merges</text>
  <text x="630" y="58" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">Decoupling 1-Second Search Visibility from Heavy Disk Commit Durability</text>

  <!-- ============================================================== -->
  <!-- STEP 1: DUAL INGESTION                                         -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="35" y="95" width="270" height="395" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
    <rect x="35" y="95" width="270" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 35 119 H 305 V 129 H 35 Z" fill="#F1F5F9"/>
    <text x="50" y="117" font-size="12" font-weight="700" fill="#1E293B">1. Ingestion Split</text>
    <rect x="225" y="102" width="70" height="18" fill="#E2E8F0" rx="4"/>
    <text x="260" y="115" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">RAM + Disk</text>

    <!-- RAM Buffer -->
    <rect x="50" y="145" width="240" height="95" fill="#EFF6FF" stroke="#BFDBFE" rx="8"/>
    <text x="60" y="167" font-size="11" font-weight="700" fill="#1E40AF">In-Memory Indexing Buffer</text>
    <text x="60" y="187" font-size="9" fill="#334155">• DocumentsWriterPerThread</text>
    <text x="60" y="203" font-size="9" fill="#334155">• Constructs postings directly in RAM</text>
    <text x="60" y="219" font-size="9" fill="#059669">• High-throughput parallel ingestion</text>

    <!-- Translog -->
    <rect x="50" y="255" width="240" height="95" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/>
    <text x="60" y="277" font-size="11" font-weight="700" fill="#1E293B">On-Disk Translog (WAL)</text>
    <text x="60" y="297" font-size="9" fill="#334155">• Append-only transaction log</text>
    <text x="60" y="313" font-size="9" fill="#334155">• Sequential disk writes (low latency)</text>
    <text x="60" y="329" font-size="9" fill="#2563EB">• Guarantees durability before flush</text>

    <!-- Explanatory footer -->
    <rect x="50" y="365" width="240" height="110" fill="#F8FAFC" stroke="#E2E8F0" rx="6"/>
    <text x="60" y="385" font-size="9.5" font-weight="700" fill="#0F172A">The Durability Paradox</text>
    <text x="60" y="405" font-size="8.5" fill="#64748B">Calling fsync on every doc caps</text>
    <text x="60" y="420" font-size="8.5" fill="#64748B">throughput to &lt; 300 ops/sec.</text>
    <text x="60" y="440" font-size="8.5" fill="#1E40AF">The Translog provides crash safety</text>
    <text x="60" y="455" font-size="8.5" fill="#1E40AF">without halting CPU indexation.</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 305 200 L 345 200" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 305 200 L 340 200" class="base-line flow-blue"/>

  <!-- ============================================================== -->
  <!-- STEP 2: NRT REFRESH GATE                                       -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="345" y="95" width="280" height="395" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="345" y="95" width="280" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 345 119 H 625 V 129 H 345 Z" fill="#DBEAFE"/>
    <text x="360" y="117" font-size="12" font-weight="700" fill="#1E40AF">2. NRT Refresh (Every 1s)</text>
    <rect x="535" y="102" width="80" height="18" fill="#2563EB" rx="4"/>
    <text x="575" y="115" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Searchable!</text>

    <!-- Buffer Flush to Page Cache -->
    <rect x="360" y="145" width="250" height="100" fill="#EFF6FF" stroke="#BFDBFE" rx="8"/>
    <text x="370" y="167" font-size="11" font-weight="700" fill="#1D4ED8">Flushed to OS Page Cache</text>
    <text x="370" y="187" font-size="9" fill="#334155">• RAM buffer written as new segment</text>
    <text x="370" y="203" font-size="9" fill="#334155">• Resides in kernel Page Cache (RAM)</text>
    <text x="370" y="219" font-size="9" fill="#DC2626">• No fsync to physical disk yet!</text>

    <!-- Point-in-Time Reader -->
    <rect x="360" y="255" width="250" height="95" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/>
    <text x="370" y="277" font-size="11" font-weight="700" fill="#1E293B">Open New IndexSearcher</text>
    <text x="370" y="297" font-size="9" fill="#334155">• Point-in-time reader opened</text>
    <text x="370" y="313" font-size="9" fill="#334155">• Segment now visible to queries</text>
    <text x="370" y="329" font-size="9" fill="#059669">• Near-real-time search visibility</text>

    <!-- Explanatory footer -->
    <rect x="360" y="365" width="250" height="110" fill="#EFF6FF" stroke="#BFDBFE" rx="6"/>
    <text x="370" y="385" font-size="9.5" font-weight="700" fill="#1E40AF">Why "Near-Real-Time"?</text>
    <text x="370" y="405" font-size="8.5" fill="#334155">A document indexed at 200ms is not</text>
    <text x="370" y="420" font-size="8.5" fill="#334155">visible until the 1s refresh boundary.</text>
    <text x="370" y="440" font-size="8.5" fill="#059669">Achieves sub-second visibility</text>
    <text x="370" y="455" font-size="8.5" fill="#059669">without waiting for physical disk I/O.</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 625 200 L 665 200" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 625 200 L 660 200" class="base-line flow-blue"/>

  <!-- ============================================================== -->
  <!-- STEP 3: FLUSH & DURABILITY COMMIT                              -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="665" y="95" width="280" height="395" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="665" y="95" width="280" height="34" fill="#D1FAE5" rx="10"/>
    <path d="M 665 119 H 945 V 129 H 665 Z" fill="#D1FAE5"/>
    <text x="680" y="117" font-size="12" font-weight="700" fill="#065F46">3. Flush (Commit to Disk)</text>
    <rect x="850" y="102" width="85" height="18" fill="#059669" rx="4"/>
    <text x="892" y="115" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">fsync Durability</text>

    <!-- Physical Disk fsync -->
    <rect x="680" y="145" width="250" height="100" fill="#ECFDF5" stroke="#A7F3D0" rx="8"/>
    <text x="690" y="167" font-size="11" font-weight="700" fill="#047857">Physical Disk fsync()</text>
    <text x="690" y="187" font-size="9" fill="#334155">• Trigger: Every 30m or 512MB Translog</text>
    <text x="690" y="203" font-size="9" fill="#334155">• Kernel writes Page Cache to flash storage</text>
    <text x="690" y="219" font-size="9" fill="#059669">• Non-volatile hardware persistence</text>

    <!-- Commit Point & Truncation -->
    <rect x="680" y="255" width="250" height="95" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/>
    <text x="690" y="277" font-size="11" font-weight="700" fill="#1E293B">Commit Marker &amp; Truncation</text>
    <text x="690" y="297" font-size="9" fill="#334155">• Commit point (segments_N) written</text>
    <text x="690" y="313" font-size="9" fill="#334155">• Translog is safely truncated</text>
    <text x="690" y="329" font-size="9" fill="#059669">• Safe crash recovery guaranteed</text>

    <!-- Explanatory footer -->
    <rect x="680" y="365" width="250" height="110" fill="#ECFDF5" stroke="#A7F3D0" rx="6"/>
    <text x="690" y="385" font-size="9.5" font-weight="700" fill="#047857">The True Durability Barrier</text>
    <text x="690" y="405" font-size="8.5" fill="#334155">If server crashes before a flush,</text>
    <text x="690" y="420" font-size="8.5" fill="#334155">Elasticsearch boots, reads last commit,</text>
    <text x="690" y="440" font-size="8.5" fill="#1E40AF">and replays operations from Translog.</text>
    <text x="690" y="455" font-size="8.5" fill="#1E40AF">Zero data loss on node failure.</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 945 200 L 985 200" class="base-line" stroke="#A7F3D0" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 945 200 L 980 200" class="base-line flow-green"/>

  <!-- ============================================================== -->
  <!-- STEP 4: TIERED MERGES & TOMBSTONE PURGING                     -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="985" y="95" width="240" height="395" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
    <rect x="985" y="95" width="240" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 985 119 H 1225 V 129 H 985 Z" fill="#F1F5F9"/>
    <text x="1000" y="117" font-size="12" font-weight="700" fill="#1E293B">4. Segment Merges</text>
    <rect x="1135" y="102" width="80" height="18" fill="#E2E8F0" rx="4"/>
    <text x="1175" y="115" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">TieredMerge</text>

    <!-- Deletion Bitmaps -->
    <rect x="1000" y="145" width="210" height="100" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/>
    <text x="1010" y="167" font-size="11" font-weight="700" fill="#1E293B">Deletions via .del Bitset</text>
    <text x="1010" y="187" font-size="9" fill="#334155">• Segments are immutable</text>
    <text x="1010" y="203" font-size="9" fill="#334155">• Deletes set tombstone bit</text>
    <text x="1010" y="219" font-size="9" fill="#64748B">• Filtered during search traversal</text>

    <!-- Background Tiered Merge -->
    <rect x="1000" y="255" width="210" height="95" fill="#EFF6FF" stroke="#BFDBFE" rx="8"/>
    <text x="1010" y="277" font-size="11" font-weight="700" fill="#1E40AF">TieredMergePolicy</text>
    <text x="1010" y="297" font-size="9" fill="#334155">• Combines small segments</text>
    <text x="1010" y="313" font-size="9" fill="#334155">• Physically drops .del docs</text>
    <text x="1010" y="329" font-size="9" fill="#059669">• Reclaims disk storage</text>

    <!-- Explanatory footer -->
    <rect x="1000" y="365" width="210" height="110" fill="#F8FAFC" stroke="#E2E8F0" rx="6"/>
    <text x="1010" y="385" font-size="9.5" font-weight="700" fill="#1E293B">Write Amplification Tax</text>
    <text x="1010" y="405" font-size="8.5" fill="#64748B">Background merges consume I/O</text>
    <text x="1010" y="420" font-size="8.5" fill="#64748B">to prevent query degradation</text>
    <text x="1010" y="440" font-size="8.5" fill="#059669">from having too many small</text>
    <text x="1010" y="455" font-size="8.5" fill="#059669">open segment readers.</text>
  </g>
</svg>