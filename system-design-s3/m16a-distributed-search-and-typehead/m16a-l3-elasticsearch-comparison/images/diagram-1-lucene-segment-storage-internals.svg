<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" fill="#F8FAFC" rx="16"/>
  <rect x="1" y="1" width="1198" height="478" fill="none" stroke="#E2E8F0" stroke-width="2" rx="16"/>

  <!-- Diagram Title Header -->
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Inside an Apache Lucene Segment: Three Specialized Storage Formats</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">Physical Separation of Inverted Search, Columnar Aggregations, and Compressed Document Hydration</text>

  <!-- Segment Outer Container -->
  <rect x="35" y="85" width="1130" height="365" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" rx="12"/>
  <rect x="50" y="75" width="230" height="22" fill="#1E293B" rx="6"/>
  <text x="165" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">LUCENE IMMUTABLE SEGMENT</text>

  <!-- ============================================================== -->
  <!-- CARD 1: INVERTED INDEX (.tim + .doc)                          -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="55" y="115" width="350" height="315" fill="#F8FAFC" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="55" y="115" width="350" height="34" fill="#D1FAE5" rx="10"/>
    <path d="M 55 139 H 405 V 149 H 55 Z" fill="#D1FAE5"/>
    <text x="70" y="137" font-size="13" font-weight="700" fill="#065F46">1. Inverted Index (.tim + .doc)</text>
    <rect x="305" y="122" width="90" height="18" fill="#059669" rx="4"/>
    <text x="350" y="135" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">Term ──▶ DocIDs</text>

    <!-- FST Prefix Index -->
    <rect x="70" y="160" width="320" height="52" fill="#FFFFFF" stroke="#A7F3D0" rx="6"/>
    <text x="80" y="178" font-size="10.5" font-weight="700" fill="#065F46">FST Prefix Index (.tip) in RAM</text>
    <text x="80" y="195" font-size="9" fill="#64748B">Maps term prefixes to disk byte offsets in .tim file</text>

    <!-- Term Dictionary & Postings -->
    <rect x="70" y="222" width="320" height="110" fill="#ECFDF5" stroke="#A7F3D0" rx="6"/>
    <text x="80" y="240" font-size="10.5" font-weight="700" fill="#047857">Term Dictionary &amp; Postings (.doc)</text>
    <text x="80" y="258" font-size="9" fill="#334155">• Terms: Lexicographically sorted terms</text>
    <text x="80" y="274" font-size="9" fill="#334155">• Postings: Packed in blocks of 128 DocIDs</text>
    <text x="80" y="290" font-size="9" fill="#334155">• SIMD PFOR-DELTA bit-packing compression</text>
    <text x="80" y="306" font-size="9" fill="#059669">• Skip lists allow skipping non-matching blocks</text>

    <!-- Access Pattern Badge -->
    <rect x="70" y="342" width="320" height="42" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
    <text x="80" y="358" font-size="9.5" font-weight="700" fill="#1E293B">Primary Access Pattern: Search</text>
    <text x="80" y="373" font-size="9" fill="#64748B">Given query terms, quickly intersect matching DocIDs.</text>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 2: DOC VALUES (.dvd + .dvm)                              -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="425" y="115" width="350" height="315" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="425" y="115" width="350" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 425 139 H 775 V 149 H 425 Z" fill="#DBEAFE"/>
    <text x="440" y="137" font-size="13" font-weight="700" fill="#1E40AF">2. Doc Values (.dvd + .dvm)</text>
    <rect x="675" y="122" width="90" height="18" fill="#2563EB" rx="4"/>
    <text x="720" y="135" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">DocID ──▶ Value</text>

    <!-- Columnar Architecture -->
    <rect x="440" y="160" width="320" height="52" fill="#FFFFFF" stroke="#BFDBFE" rx="6"/>
    <text x="450" y="178" font-size="10.5" font-weight="700" fill="#1E40AF">Column-Oriented Disk Storage</text>
    <text x="450" y="195" font-size="9" fill="#64748B">Values stored contiguously for high-speed sequential scan</text>

    <!-- OS Page Cache mmap -->
    <rect x="440" y="222" width="320" height="110" fill="#EFF6FF" stroke="#BFDBFE" rx="6"/>
    <text x="450" y="240" font-size="10.5" font-weight="700" fill="#1D4ED8">Linux OS Page Cache (mmap)</text>
    <text x="450" y="258" font-size="9" fill="#334155">• Files mapped directly into kernel memory cache</text>
    <text x="450" y="274" font-size="9" fill="#334155">• Zero JVM Garbage Collection heap overhead</text>
    <text x="450" y="290" font-size="9" fill="#334155">• Linux kernel manages paging and cache evictions</text>
    <text x="450" y="306" font-size="9" fill="#059669">• Prevents Out-Of-Memory (OOM) heap crashes</text>

    <!-- Access Pattern Badge -->
    <rect x="440" y="342" width="320" height="42" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
    <text x="450" y="358" font-size="9.5" font-weight="700" fill="#1E293B">Primary Access Pattern: Analytics</text>
    <text x="450" y="373" font-size="9" fill="#64748B">Given candidate DocIDs, extract values for sorting &amp; facets.</text>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 3: STORED FIELDS (.fdt + .fdx)                           -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="795" y="115" width="350" height="315" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8" rx="10"/>
    <rect x="795" y="115" width="350" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 795 139 H 1145 V 149 H 795 Z" fill="#F1F5F9"/>
    <text x="810" y="137" font-size="13" font-weight="700" fill="#1E293B">3. Stored Fields (.fdt + .fdx)</text>
    <rect x="1045" y="122" width="90" height="18" fill="#64748B" rx="4"/>
    <text x="1090" y="135" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">DocID ──▶ JSON</text>

    <!-- Field Index -->
    <rect x="810" y="160" width="320" height="52" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
    <text x="820" y="178" font-size="10.5" font-weight="700" fill="#1E293B">Field Index (.fdx)</text>
    <text x="820" y="195" font-size="9" fill="#64748B">Binary radix tree mapping DocID to byte offsets in .fdt</text>

    <!-- Compressed Field Data -->
    <rect x="810" y="222" width="320" height="110" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
    <text x="820" y="240" font-size="10.5" font-weight="700" fill="#334155">Compressed Field Data (.fdt)</text>
    <text x="820" y="258" font-size="9" fill="#334155">• Chunks of 16KB compressed with LZ4 / Deflate</text>
    <text x="820" y="274" font-size="9" fill="#334155">• Row-oriented storage of raw _source document</text>
    <text x="820" y="290" font-size="9" fill="#334155">• Point lookup: only top-K hits are decompressed</text>
    <text x="820" y="306" font-size="9" fill="#059669">• Never parsed or touched during posting traversal</text>

    <!-- Access Pattern Badge -->
    <rect x="810" y="342" width="320" height="42" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
    <text x="820" y="358" font-size="9.5" font-weight="700" fill="#1E293B">Primary Access Pattern: Hydration</text>
    <text x="820" y="373" font-size="9" fill="#64748B">Extract full JSON title &amp; content for top 10 search hits.</text>
  </g>
</svg>