<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 500" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1220" height="500" fill="#F8FAFC" rx="16"/>
  <rect x="1" y="1" width="1218" height="498" fill="none" stroke="#E2E8F0" stroke-width="2" rx="16"/>

  <!-- Diagram Title Header -->
  <text x="610" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Candidate Retrieval &amp; Scoring: Conjunctive AND vs. Disjunctive OR with WAND</text>
  <text x="610" y="56" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">Why Boolean Intersection Causes the "Conjunctive Cliff" While WAND Disjunction Safely Surfaces Relevant Hits</text>

  <!-- Query Input Header -->
  <g filter="url(#shadow)">
    <rect x="50" y="75" width="1120" height="52" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" rx="8"/>
    <text x="70" y="96" font-size="11" font-weight="700" fill="#64748B">EXPLORATORY USER QUERY (4 TERMS):</text>
    <text x="70" y="115" font-size="13" font-family="monospace" font-weight="700" fill="#2563EB">"redis cache clustering and sharding"</text>
    <rect x="910" y="87" width="240" height="26" fill="#F1F5F9" rx="6"/>
    <text x="1030" y="104" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">Doc 1: Redis/Cluster | Doc 3: Sharding</text>
  </g>

  <!-- Connectors from Input to Both Tracks -->
  <path d="M 350 127 L 350 160" class="base-line" stroke="#A7F3D0" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 350 127 L 350 155" class="base-line flow-green"/>

  <path d="M 870 127 L 870 160" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 870 127 L 870 155" class="base-line flow-blue"/>

  <!-- ============================================================== -->
  <!-- TRACK A: HOMEMADE CONJUNCTIVE AND                              -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="165" width="530" height="305" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" rx="10"/>
    <rect x="50" y="165" width="530" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 50 189 H 580 V 199 H 50 Z" fill="#F1F5F9"/>
    <text x="65" y="187" font-size="12" font-weight="700" fill="#1E293B">Homemade Index: Conjunctive Retrieval (Boolean AND)</text>
    <rect x="480" y="172" width="85" height="18" fill="#DC2626" rx="4"/>
    <text x="522" y="185" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Strict AND</text>

    <!-- Two-Pointer Mechanism -->
    <rect x="65" y="210" width="500" height="60" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="75" y="228" font-size="10.5" font-weight="700" fill="#1E293B">Two-Pointer Sorted Posting Intersection:</text>
    <text x="75" y="246" font-size="9.5" font-family="monospace" fill="#334155">postings['redis'] ∩ postings['cache'] ∩ postings['clustering'] ∩ postings['sharding']</text>
    <text x="75" y="260" font-size="8.5" fill="#64748B">Linear scan requires every single query term to appear in the candidate document.</text>

    <!-- Evaluation Box -->
    <rect x="65" y="280" width="500" height="75" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="75" y="298" font-size="10" font-weight="700" fill="#334155">Posting Evaluation:</text>
    <text x="75" y="316" font-size="9" fill="#64748B">• Doc 1 has {'redis', 'cache', 'clustering'} ──▶ Missing 'sharding' (DISCARDED)</text>
    <text x="75" y="332" font-size="9" fill="#64748B">• Doc 3 has {'cache', 'sharding'} ─────────────▶ Missing 'redis' (DISCARDED)</text>
    <text x="75" y="347" font-size="9" fill="#64748B">• Intersection count = 0 candidates</text>

    <!-- Outcome: The Conjunctive Cliff -->
    <rect x="65" y="365" width="500" height="90" fill="#FEF2F2" stroke="#FCA5A5" rx="6"/>
    <text x="75" y="385" font-size="11" font-weight="700" fill="#991B1B">The Conjunctive Cliff (0 Hits Returned)</text>
    <text x="75" y="405" font-size="9.5" fill="#B91C1C">• Precision@1 = 0.0000 | Recall@3 = 0.0000 | MAP = 0.0000</text>
    <text x="75" y="423" font-size="8.5" fill="#7F1D1D">Catastrophic false negative: Although Doc 1 and Doc 3 are highly authoritative</text>
    <text x="75" y="437" font-size="8.5" fill="#7F1D1D">guides, strict Boolean AND drops both because neither has all 4 words.</text>
  </g>

  <!-- ============================================================== -->
  <!-- TRACK B: ELASTICSEARCH DISJUNCTIVE OR + WAND                   -->
  <!-- ============================================================== -->
  <g filter="url(#shadow)">
    <rect x="620" y="165" width="550" height="305" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="620" y="165" width="550" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 620 189 H 1170 V 199 H 620 Z" fill="#DBEAFE"/>
    <text x="635" y="187" font-size="12" font-weight="700" fill="#1E40AF">Elasticsearch: Disjunctive Candidate Retrieval (Boolean OR + WAND)</text>
    <rect x="1070" y="172" width="85" height="18" fill="#2563EB" rx="4"/>
    <text x="1112" y="185" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">WAND + BM25</text>

    <!-- Union Mechanism -->
    <rect x="635" y="210" width="520" height="60" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="645" y="228" font-size="10.5" font-weight="700" fill="#1E293B">Posting Union &amp; WAND Pruning:</text>
    <text x="645" y="246" font-size="9.5" font-family="monospace" fill="#2563EB">postings['redis'] ∪ postings['cache'] ∪ postings['clustering'] ∪ postings['sharding']</text>
    <text x="645" y="260" font-size="8.5" fill="#64748B">Weak AND (WAND) skips uncompetitive postings whose upper-bound score cannot beat top-K.</text>

    <!-- Evaluation Box -->
    <rect x="635" y="280" width="520" height="75" fill="#EFF6FF" stroke="#BFDBFE" rx="6"/>
    <text x="645" y="298" font-size="10" font-weight="700" fill="#1E40AF">Score Accumulation Across Matching Terms:</text>
    <text x="645" y="316" font-size="9" fill="#1E3A8A">• Doc 1 matches 3 terms ('redis', 'cache', 'clustering') ──▶ BM25 Score: 5.77 (Rank #1)</text>
    <text x="645" y="332" font-size="9" fill="#1E3A8A">• Doc 3 matches 2 terms ('cache', 'sharding') ────────────▶ BM25 Score: 2.83 (Rank #2)</text>
    <text x="645" y="347" font-size="9" fill="#1E3A8A">• Doc 9 matches 1 term ('cache') ────────────────────────▶ BM25 Score: 2.50 (Rank #3)</text>

    <!-- Outcome: 100% P@1 -->
    <rect x="635" y="365" width="520" height="90" fill="#ECFDF5" stroke="#A7F3D0" rx="6"/>
    <text x="645" y="385" font-size="11" font-weight="700" fill="#065F46">Disjunctive Retrieval Victory (100% P@1 &amp; AP = 0.92)</text>
    <text x="645" y="405" font-size="9.5" fill="#047857">• Precision@1 = 1.0000 | Recall@3 = 0.6700 | Average Precision = 0.9167</text>
    <text x="645" y="423" font-size="8.5" fill="#065F46">Surfaces both relevant documents cleanly without requiring an exact 4-term match.</text>
    <text x="645" y="437" font-size="8.5" fill="#065F46">WAND optimization keeps evaluation sub-millisecond even across large collections.</text>
  </g>
</svg>