<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .card-header-blue { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; }
      .card-header-green { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.5; }
      .card-header-red { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5; }
      .card-header-slate { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 19px; fill: #0F172A; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .bold-text { font-weight: 600; fill: #1E293B; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; }
      .flow-line-red { stroke: #DC2626; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .flow-line-green { stroke: #059669; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .solid-line { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="540" class="bg"/>

  <!-- Main Canvas Card Frame -->
  <rect x="20" y="20" width="940" height="500" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Title Banner -->
  <text x="490" y="52" text-anchor="middle" class="title-text">Candidate Retrieval: The Boolean AND Cliff vs. Disjunctive WAND OR</text>
  <text x="490" y="73" text-anchor="middle" class="subtitle-text">Comparing strict conjunctive intersection against disjunctive candidate pooling with dynamic Top-K pruning</text>

  <!-- Input Query Bar -->
  <g transform="translate(50, 92)">
    <rect width="880" height="42" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" rx="6"/>
    <text x="15" y="26" class="bold-text" font-size="12" fill="#1E293B">Benchmark Query A2: <tspan fill="#2563EB" font-family="ui-monospace">"redis cache clustering and sharding"</tspan></text>
    <text x="520" y="26" class="subtitle-text">Targets: <tspan fill="#059669" font-weight="600">Doc 1 (Redis/Cluster) + Doc 3 (Sharding)</tspan></text>
  </g>

  <!-- ============================================================== -->
  <!-- LEFT COLUMN: STRICT BOOLEAN AND (CONJUNCTIVE)                  -->
  <!-- ============================================================== -->
  <g transform="translate(50, 145)">
    <rect width="425" height="270" class="card" stroke="#EF4444"/>
    <path d="M 0 8 Q 0 0 8 0 L 417 0 Q 425 0 425 8 L 425 26 L 0 26 Z" class="card-header-red"/>
    <text x="212" y="18" text-anchor="middle" class="bold-text" fill="#991B1B" font-size="11">1. STRICT BOOLEAN AND (FIRST PRINCIPLES INDEX)</text>

    <!-- Sub-step 1: Term Postings -->
    <g transform="translate(15, 38)">
      <rect width="395" height="74" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#991B1B">Term Posting Lists in RAM:</text>
      <text x="12" y="34" class="mono-text">• "redis"      ──▶ {Doc 1}</text>
      <text x="12" y="50" class="mono-text">• "cache"      ──▶ {Doc 1, Doc 3, Doc 5, Doc 9}</text>
      <text x="210" y="34" class="mono-text">• "clustering" ──▶ {Doc 1, Doc 6}</text>
      <text x="210" y="50" class="mono-text">• "sharding"   ──▶ {Doc 3, Doc 7}</text>
    </g>

    <!-- Sub-step 2: Two-Pointer Intersection -->
    <g transform="translate(15, 122)">
      <rect width="395" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#991B1B">Conjunctive 2-Pointer Intersection:</text>
      <text x="12" y="34" class="mono-text">{1} ∩ {1, 3, 5, 9} ∩ {1, 6} ∩ {3, 7}  ──▶ ∅</text>
      <text x="12" y="50" class="subtitle-text">Requires EVERY term to exist in the exact same document.</text>
    </g>

    <!-- Sub-step 3: Failure Outcome -->
    <g transform="translate(15, 192)">
      <rect width="395" height="66" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" rx="6"/>
      <text x="12" y="22" class="bold-text" font-size="11" fill="#991B1B">[THE CONJUNCTIVE CLIFF] 0 Hits Returned</text>
      <text x="12" y="40" class="body-text">Doc 1 covers Redis/Cache/Cluster; Doc 3 covers Sharding.</text>
      <text x="12" y="56" class="badge-text" fill="#DC2626">Because no single doc has all 4 words: P@1 = 0.00, R@3 = 0.00</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT COLUMN: DISJUNCTIVE WAND OR (ELASTICSEARCH)              -->
  <!-- ============================================================== -->
  <g transform="translate(505, 145)">
    <rect width="425" height="270" class="card" stroke="#10B981"/>
    <path d="M 0 8 Q 0 0 8 0 L 417 0 Q 425 0 425 8 L 425 26 L 0 26 Z" class="card-header-green"/>
    <text x="212" y="18" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">2. DISJUNCTIVE OR + BLOCK-MAX WAND (LUCENE)</text>

    <!-- Sub-step 1: Disjunctive Union Pool -->
    <g transform="translate(15, 38)">
      <rect width="395" height="74" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#065F46">Disjunctive Candidate Pool (Union):</text>
      <text x="12" y="34" class="mono-text">Pool: {Doc 1, Doc 3, Doc 5, Doc 6, Doc 7, Doc 9}</text>
      <text x="12" y="50" class="body-text">Surfaces documents matching ANY query keyword</text>
      <text x="12" y="66" class="badge-text" fill="#059669">Protects against partial keyword omission</text>
    </g>

    <!-- Sub-step 2: WAND Dynamic Pruning -->
    <g transform="translate(15, 122)">
      <rect width="395" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="6"/>
      <text x="12" y="18" class="bold-text" font-size="11" fill="#065F46">Block-Max WAND Top-K Pruning:</text>
      <text x="12" y="34" class="mono-text">Computes upper bound: max_score = Σ (IDF_t * max_TF_t)</text>
      <text x="12" y="50" class="subtitle-text">Skips low-scoring postings dynamically without full scoring</text>
    </g>

    <!-- Sub-step 3: Success Outcome -->
    <g transform="translate(15, 192)">
      <rect width="395" height="66" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" rx="6"/>
      <text x="12" y="22" class="bold-text" font-size="11" fill="#065F46">[SURFACES BOTH WINNERS] Hits: [Doc 1, Doc 3, Doc 9]</text>
      <text x="12" y="40" class="body-text">• Rank 1: Doc 1 (Score: 5.77) | • Rank 2: Doc 3 (Score: 2.83)</text>
      <text x="12" y="56" class="badge-text" fill="#059669">High relevance without conjunctive cliff: P@1 = 1.0000</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM TAKEAWAY: ARCHITECTURAL TAKEAWAY                        -->
  <!-- ============================================================== -->
  <g transform="translate(50, 427)">
    <rect width="880" height="78" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="8"/>
    <text x="15" y="22" class="bold-text" font-size="12" fill="#1E40AF">Production Engineering Trade-Off: Boolean Precision vs. WAND Scalability</text>
    <text x="15" y="42" class="body-text">• Boolean AND acts as a hard filter: Extremely fast (0.02ms) but drops relevant documents when users search with exploratory phrases.</text>
    <text x="15" y="60" class="body-text">• Lucene Disjunctive Match treats queries as statistical signals: Block-Max WAND skips non-competitive candidates, delivering Boolean-like speed with 100% recall.</text>
  </g>
</svg>
