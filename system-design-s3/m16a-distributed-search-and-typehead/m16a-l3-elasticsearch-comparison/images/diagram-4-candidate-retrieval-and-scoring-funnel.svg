<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 670" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropGlow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrBlue4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrGreen4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#10b981"/>
    </marker>
    <marker id="arrRose4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#f43f5e"/>
    </marker>

    <!-- Styles -->
    <style>
      .flow-blue4 {
        stroke: #3b82f6;
        stroke-width: 2.2;
        stroke-dasharray: 6 4;
        animation: flow4 1.6s linear infinite;
        fill: none;
      }
      .flow-green4 {
        stroke: #10b981;
        stroke-width: 2.2;
        stroke-dasharray: 6 4;
        animation: flow4 1.6s linear infinite;
        fill: none;
      }
      .flow-rose4 {
        stroke: #f43f5e;
        stroke-width: 2.2;
        stroke-dasharray: 6 4;
        animation: flow4 1.6s linear infinite;
        fill: none;
      }
      @keyframes flow4 {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Title Card -->
  <rect x="30" y="20" width="1160" height="60" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5" filter="url(#dropGlow4)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#3b82f6"/>
  <text x="55" y="45" fill="#f8fafc" font-size="18" font-weight="700">Candidate Retrieval &amp; Scoring Mechanics: Two-Pointer AND vs. Lucene Disjunction</text>
  <text x="55" y="65" fill="#94a3b8" font-size="12">Why Multi-Term Queries Silently Fail on Simple Inverted Indexes and How WAND Solves Candidate Generation</text>
  <rect x="1025" y="35" width="150" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="1100" y="53" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">Retrieval Funnel</text>

  <!-- Query Term Breakdown Banner (Top) -->
  <rect x="30" y="95" width="1160" height="85" rx="12" fill="url(#cardGrad4)" stroke="#475569" stroke-width="1.5" filter="url(#dropGlow4)"/>
  <text x="50" y="120" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.5">BENCHMARK QUERY A2 (MULTI-TERM DISJUNCTION):</text>
  <text x="50" y="145" fill="#38bdf8" font-size="16" font-family="monospace" font-weight="700">"redis cache clustering and sharding"</text>

  <!-- Term Postings Pills -->
  <rect x="480" y="112" width="150" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="555" y="132" fill="#e2e8f0" font-size="10.5" font-weight="700" text-anchor="middle">"redis" + "cluster"</text>
  <text x="555" y="150" fill="#34d399" font-size="9.5" text-anchor="middle">Posting: [Doc 1]</text>

  <rect x="645" y="112" width="150" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="720" y="132" fill="#e2e8f0" font-size="10.5" font-weight="700" text-anchor="middle">"cache"</text>
  <text x="720" y="150" fill="#60a5fa" font-size="9.5" text-anchor="middle">Posting: [Doc 1, 5, 9]</text>

  <rect x="810" y="112" width="150" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="885" y="132" fill="#e2e8f0" font-size="10.5" font-weight="700" text-anchor="middle">"sharding"</text>
  <text x="885" y="150" fill="#f59e0b" font-size="9.5" text-anchor="middle">Posting: [Doc 3]</text>

  <rect x="975" y="112" width="200" height="52" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="1075" y="132" fill="#c084fc" font-size="10.5" font-weight="700" text-anchor="middle">Corpus Fact</text>
  <text x="1075" y="150" fill="#e9d5ff" font-size="9.5" text-anchor="middle">No single doc contains all 4!</text>

  <!-- LEFT FUNNEL: Custom Python Index (Strict Boolean AND) -->
  <rect x="30" y="195" width="560" height="450" rx="14" fill="url(#cardGrad4)" stroke="#f43f5e" stroke-width="1.5" filter="url(#dropGlow4)"/>
  <rect x="45" y="210" width="530" height="30" rx="5" fill="#3f121a" stroke="#be123c" stroke-width="1"/>
  <text x="310" y="230" fill="#fecdd3" font-size="13" font-weight="700" text-anchor="middle">CUSTOM INDEX: CONJUNCTIVE RETRIEVAL (Boolean AND)</text>

  <!-- Step 1: Intersection Logic -->
  <rect x="45" y="255" width="530" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="278" fill="#fda4af" font-size="12" font-weight="700">Two-Pointer Sorted Posting Intersection</text>
  <text x="60" y="298" fill="#94a3b8" font-size="10.5">Algorithm: P(redis) ∩ P(cache) ∩ P(clustering) ∩ P(sharding)</text>
  <text x="60" y="316" fill="#cbd5e1" font-size="10">Scans pointers linearly in O(L1 + L2 + L3 + L4) time</text>
  <text x="60" y="332" fill="#cbd5e1" font-size="10">Candidate set requires document to appear in ALL four lists</text>

  <!-- Step 2: The Failure Point -->
  <rect x="45" y="360" width="530" height="95" rx="8" fill="#240c12" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="60" y="383" fill="#f87171" font-size="12" font-weight="700">The Conjunctive Cliff (Empty Intersection)</text>
  <text x="60" y="405" fill="#fda4af" font-size="10.5">• Doc 1 contains [redis, cache, cluster], but NOT [sharding]</text>
  <text x="60" y="423" fill="#fda4af" font-size="10.5">• Doc 3 contains [sharding], but NOT [redis, cache]</text>
  <text x="60" y="441" fill="#fca5a5" font-size="10" font-weight="700">Intersection P(redis) ∩ P(sharding) evaluates to EMPTY SET: [ ]</text>

  <!-- Step 3: Result Box -->
  <rect x="45" y="470" width="530" height="155" rx="8" fill="#18070b" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="80" cy="510" r="20" fill="#3f121a" stroke="#f43f5e" stroke-width="2"/>
  <path d="M 70 500 L 90 520 M 90 500 L 70 520" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="115" y="505" fill="#f87171" font-size="14" font-weight="700">Result: 0 Hits Returned</text>
  <text x="115" y="525" fill="#fda4af" font-size="11">Recall@10 = 0.0000 | Precision@1 = 0.0000 | AP = 0.0000</text>
  <line x1="60" y1="545" x2="550" y2="545" stroke="#334155" stroke-width="1"/>
  <text x="60" y="570" fill="#94a3b8" font-size="10.5">Diagnostic Rationale:</text>
  <text x="60" y="588" fill="#cbd5e1" font-size="10">A single missing token causes a catastrophic false negative.</text>
  <text x="60" y="605" fill="#fca5a5" font-size="10">User intent was exploratory research, but engine treated it as rigid SQL WHERE.</text>

  <!-- RIGHT FUNNEL: Elasticsearch (Disjunctive OR + WAND + BM25) -->
  <rect x="630" y="195" width="560" height="450" rx="14" fill="url(#cardGrad4)" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropGlow4)"/>
  <rect x="645" y="210" width="530" height="30" rx="5" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
  <text x="910" y="230" fill="#bfdbfe" font-size="13" font-weight="700" text-anchor="middle">ELASTICSEARCH: DISJUNCTIVE RETRIEVAL (match: OR + WAND)</text>

  <!-- Step 1: Disjunctive Candidate Union -->
  <rect x="645" y="255" width="530" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="660" y="278" fill="#60a5fa" font-size="12" font-weight="700">Disjunctive Posting Union + WAND Optimization</text>
  <text x="660" y="298" fill="#94a3b8" font-size="10.5">Algorithm: P(redis) ∪ P(cache) ∪ P(clustering) ∪ P(sharding)</text>
  <text x="660" y="316" fill="#cbd5e1" font-size="10">Candidate set = [Doc 1, Doc 3, Doc 5, Doc 9]</text>
  <text x="660" y="332" fill="#38bdf8" font-size="10" font-weight="600">WAND (Weak AND) dynamically prunes docs that cannot beat top-K score</text>

  <!-- Step 2: BM25 Accumulator -->
  <rect x="645" y="360" width="530" height="95" rx="8" fill="#0b1b38" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="660" y="383" fill="#93c5fd" font-size="12" font-weight="700">Linear BM25 Score Accumulation</text>
  <text x="660" y="405" fill="#e2e8f0" font-size="10.5">• Doc 1: BM25(redis) + BM25(cache) + BM25(cluster) = 5.77</text>
  <text x="660" y="423" fill="#e2e8f0" font-size="10.5">• Doc 3: BM25(sharding) = 2.83 (high IDF on rare technical term!)</text>
  <text x="660" y="441" fill="#34d399" font-size="10" font-weight="700">Both documents successfully surface and receive proportional scores</text>

  <!-- Step 3: Result Box -->
  <rect x="645" y="470" width="530" height="155" rx="8" fill="#08152e" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="680" cy="510" r="20" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <path d="M 670 510 L 677 517 L 692 502" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <text x="715" y="505" fill="#34d399" font-size="14" font-weight="700">Result: Highly Relevant Candidates Ranked</text>
  <text x="715" y="525" fill="#a7f3d0" font-size="11">Recall@3 = 0.6667 | Precision@1 = 1.0000 | AP = 0.9167</text>
  <line x1="660" y1="545" x2="1150" y2="545" stroke="#334155" stroke-width="1"/>
  <text x="660" y="570" fill="#f1f5f9" font-size="10.5">Ranked Order:</text>
  <text x="660" y="588" fill="#93c5fd" font-size="10">Rank 1: Doc 1 (Score: 5.77) - Distributed In-Memory Caching with Redis</text>
  <text x="660" y="605" fill="#cbd5e1" font-size="10">Rank 2: Doc 3 (Score: 2.83) - Database Sharding &amp; Horizontal Partitioning</text>

  <!-- Connecting Arrows -->
  <path d="M 310 180 L 310 195" class="flow-rose4" marker-end="url(#arrRose4)"/>
  <path d="M 910 180 L 910 195" class="flow-blue4" marker-end="url(#arrBlue4)"/>
</svg>
