<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .card-header-blue { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; }
      .card-header-green { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.5; }
      .card-header-slate { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 19px; fill: #0F172A; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .bold-text { font-weight: 600; fill: #1E293B; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
      .flow-line { stroke: #2563EB; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .flow-line-green { stroke: #059669; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .solid-line { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="640" class="bg"/>

  <!-- Main Canvas Card Frame -->
  <rect x="20" y="20" width="980" height="600" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Title Banner -->
  <text x="510" y="52" text-anchor="middle" class="title-text">Dual-Engine Search Architecture: Inverted Index vs. Elasticsearch</text>
  <text x="510" y="73" text-anchor="middle" class="subtitle-text">End-to-End System Pipeline: Corpus Ingestion, Dual Candidate Engines &amp; Cranfield IR Evaluation</text>

  <!-- ============================================================== -->
  <!-- TIER 1: INGRESS HARNESS & WORKLOAD DISPATCHER                  -->
  <!-- ============================================================== -->

  <!-- Card 1A: Seed Corpus -->
  <g transform="translate(50, 95)">
    <rect width="280" height="92" class="card" stroke="#3B82F6"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 26 L 0 26 Z" class="card-header-blue"/>
    <text x="140" y="18" text-anchor="middle" class="bold-text" fill="#1E40AF" font-size="11">1A. SEED CORPUS (corpus.py)</text>
    <text x="14" y="44" class="body-text">9 Distributed Systems Documents</text>
    <text x="14" y="62" class="subtitle-text">Redis, Raft, Sharding, Consistent Hashing</text>
    <text x="14" y="80" class="badge-text" fill="#2563EB">Identical raw text fed to both engines</text>
  </g>

  <!-- Card 1B: Benchmark Harness -->
  <g transform="translate(370, 95)">
    <rect width="280" height="92" class="card" stroke="#2563EB"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 26 L 0 26 Z" class="card-header-blue"/>
    <text x="140" y="18" text-anchor="middle" class="bold-text" fill="#1E40AF" font-size="11">1B. BENCHMARK HARNESS (benchmark.py)</text>
    <text x="14" y="44" class="body-text">6 Curated Verification Queries</text>
    <text x="14" y="62" class="subtitle-text">Queries A1-A3: Morphological, Disjunctive, Stopwords</text>
    <text x="14" y="80" class="badge-text" fill="#2563EB">Queries B1-B3: Hyphens, Small IDF, RAM Latency</text>
  </g>

  <!-- Card 1C: Ground Truth Annotations -->
  <g transform="translate(690, 95)">
    <rect width="280" height="92" class="card" stroke="#10B981"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 26 L 0 26 Z" class="card-header-green"/>
    <text x="140" y="18" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">1C. CRANFIELD GROUND TRUTH</text>
    <text x="14" y="44" class="body-text">relevance_judgments.json</text>
    <text x="14" y="62" class="subtitle-text">Human-annotated binary relevance (DocIDs)</text>
    <text x="14" y="80" class="badge-text" fill="#059669">Strict ground truth for P@k, R@k, MAP</text>
  </g>

  <!-- Connectors: Tier 1 -> Tier 2 -->
  <path d="M 190 187 L 190 220" class="flow-line" marker-end="url(#arrow)"/>
  <path d="M 510 187 L 270 215 L 270 240" class="flow-line" marker-end="url(#arrow)"/>
  <path d="M 510 187 L 750 215 L 750 240" class="flow-line-green" marker-end="url(#arrow-green)"/>

  <!-- ============================================================== -->
  <!-- TIER 2: DUAL-ENGINE PARALLEL PROCESSING CORE                   -->
  <!-- ============================================================== -->
  <rect x="50" y="215" width="920" height="260" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4" rx="10"/>
  <text x="65" y="236" class="bold-text" fill="#475569" font-size="12">TIER 2: DUAL-ENGINE PARALLEL PROCESSING CORE (Identical Seed Corpus &amp; Query Workload)</text>

  <!-- Engine A: First Principles Prototype -->
  <g transform="translate(70, 250)">
    <rect width="420" height="210" class="card" stroke="#3B82F6"/>
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 26 L 0 26 Z" class="card-header-blue"/>
    <text x="210" y="18" text-anchor="middle" class="bold-text" fill="#1E40AF" font-size="11">ENGINE A: FIRST PRINCIPLES PYTHON INDEX (homemade_adapter.py)</text>

    <text x="15" y="46" class="body-text">• Text Analysis: Regex Tokenizer (\b[a-zA-Z0-9_-]+\b) + Case Folding</text>
    <text x="15" y="66" class="body-text">• Storage: In-Memory Inverted Dictionary (dict[str, list[int]])</text>
    <text x="15" y="86" class="body-text">• Candidate Retrieval: Two-Pointer Boolean AND Intersection</text>
    <text x="15" y="106" class="body-text">• Relevance Ranking: Exact 64-bit Float IEEE 754 BM25 Scoring</text>
    <text x="15" y="126" class="body-text">• Architecture: Single-threaded in-process RAM traversal (CPU cache)</text>

    <!-- Metrics Callout Box -->
    <g transform="translate(15, 142)">
      <rect width="390" height="54" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" rx="6"/>
      <text x="12" y="22" class="badge-text" fill="#1E40AF">Mean Latency: 0.05 ms (130x Faster Execution in RAM)</text>
      <text x="12" y="42" class="badge-text" fill="#DC2626">Limitation: Conjunctive Cliff (0 hits if single term missing)</text>
    </g>
  </g>

  <!-- Engine B: Production Elasticsearch -->
  <g transform="translate(530, 250)">
    <rect width="420" height="210" class="card" stroke="#10B981"/>
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 26 L 0 26 Z" class="card-header-green"/>
    <text x="210" y="18" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">ENGINE B: DOCKER ELASTICSEARCH NODE (es_client.py)</text>

    <text x="15" y="46" class="body-text">• Multi-Field Mappings: standard, english (Porter Stemmer), exact</text>
    <text x="15" y="66" class="body-text">• Storage: Immutable Lucene Segments (.tim, .doc, .dvd) + Translog WAL</text>
    <text x="15" y="86" class="body-text">• Candidate Retrieval: Disjunctive OR with Block-Max WAND Top-K</text>
    <text x="15" y="106" class="body-text">• Relevance Ranking: Lucene BM25 with 1-byte lossy norm table</text>
    <text x="15" y="126" class="body-text">• Architecture: Containerized REST daemon, Page Cache mmap, Netty</text>

    <!-- Metrics Callout Box -->
    <g transform="translate(15, 142)">
      <rect width="390" height="54" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" rx="6"/>
      <text x="12" y="22" class="badge-text" fill="#065F46">Mean Latency: 6.62 ms (Network I/O, JSON &amp; Abstraction Tax)</text>
      <text x="12" y="42" class="badge-text" fill="#059669">Advantage: 100% Precision@1, Morphological Stemming &amp; Durability</text>
    </g>
  </g>

  <!-- Connectors: Tier 2 -> Tier 3 -->
  <path d="M 280 460 L 280 495" class="flow-line" marker-end="url(#arrow)"/>
  <path d="M 740 460 L 740 495" class="flow-line-green" marker-end="url(#arrow-green)"/>

  <!-- ============================================================== -->
  <!-- TIER 3: CRANFIELD IR EVALUATION ENGINE & VERDICT               -->
  <!-- ============================================================== -->
  <g transform="translate(50, 495)">
    <rect width="920" height="105" class="card" stroke="#64748B"/>
    <path d="M 0 8 Q 0 0 8 0 L 912 0 Q 920 0 920 8 L 920 26 L 0 26 Z" class="card-header-slate"/>
    <text x="460" y="18" text-anchor="middle" class="bold-text" fill="#334155" font-size="11">TIER 3: CRANFIELD EVALUATION ENGINE &amp; EMPIRICAL VERDICT (evaluator.py)</text>

    <!-- Evaluation Engine Details -->
    <g transform="translate(15, 36)">
      <text x="0" y="14" class="bold-text" font-size="11" fill="#1E293B">Mathematical Information Retrieval Metrics Pipeline:</text>
      <text x="0" y="32" class="body-text">• Precision@k (P@1, P@3): Result viewport purity</text>
      <text x="0" y="48" class="body-text">• Recall@k (R@3): Global corpus coverage</text>
      <text x="280" y="32" class="body-text">• Reciprocal Rank (RR): First relevant hit position</text>
      <text x="280" y="48" class="body-text">• Average Precision (AP): Area under PR curve</text>
    </g>

    <!-- Empirical Verdict Badges -->
    <g transform="translate(560, 36)">
      <rect width="345" height="26" fill="#ECFDF5" stroke="#10B981" rx="4"/>
      <text x="10" y="17" class="badge-text" fill="#065F46">ES English: MAP = 0.8472 | P@1 = 1.0000 (Dominates)</text>

      <rect y="32" width="345" height="26" fill="#EFF6FF" stroke="#3B82F6" rx="4"/>
      <text x="10" y="49" class="badge-text" fill="#1E40AF">Homemade: Latency = 0.05 ms (130x Faster in RAM)</text>
    </g>
  </g>
</svg>
