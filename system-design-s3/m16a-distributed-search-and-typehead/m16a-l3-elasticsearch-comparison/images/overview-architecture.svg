<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowSlate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#64748b"/>
    </marker>

    <!-- Styles -->
    <style>
      .flow-line-blue {
        stroke: #3b82f6;
        stroke-width: 2.5;
        stroke-dasharray: 6 4;
        animation: flowAnimation 1.5s linear infinite;
        fill: none;
      }
      .flow-line-emerald {
        stroke: #10b981;
        stroke-width: 2.5;
        stroke-dasharray: 6 4;
        animation: flowAnimation 1.5s linear infinite;
        fill: none;
      }
      .flow-line-purple {
        stroke: #8b5cf6;
        stroke-width: 2.5;
        stroke-dasharray: 6 4;
        animation: flowAnimation 1.5s linear infinite;
        fill: none;
      }
      .solid-line {
        stroke: #475569;
        stroke-width: 1.5;
        fill: none;
      }
      @keyframes flowAnimation {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Title Block -->
  <rect x="30" y="20" width="1180" height="60" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropGlow)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#3b82f6"/>
  <text x="55" y="45" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.3">Dual-Engine Search Shootout: First Principles vs. Production Elasticsearch</text>
  <text x="55" y="65" fill="#94a3b8" font-size="12">End-to-End Evaluation Architecture: Identical Corpus &amp; Query Stream Routed to Dual Ranking Engines</text>
  <rect x="1050" y="35" width="140" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="1120" y="53" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">Poridhi S3 Lab Suite</text>

  <!-- SECTION 1: Input Assets Layer (Left Column) -->
  <rect x="30" y="105" width="250" height="565" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropGlow)"/>
  <rect x="45" y="120" width="220" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="155" y="141" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">1. Input Assets &amp; Seeds</text>

  <!-- Box 1.1: Corpus -->
  <rect x="45" y="170" width="220" height="135" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <rect x="55" y="180" width="80" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="95" y="194" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">corpus.py</text>
  <text x="55" y="222" fill="#f1f5f9" font-size="13" font-weight="700">Seed Corpus (9 Docs)</text>
  <text x="55" y="242" fill="#94a3b8" font-size="11">Distributed systems topics</text>
  <text x="55" y="258" fill="#94a3b8" font-size="11">Raft, Redis, Sharding, Kafka</text>
  <text x="55" y="278" fill="#cbd5e1" font-size="10" font-family="monospace">AvgDL: 36.44 tokens</text>

  <!-- Box 1.2: Benchmark Queries -->
  <rect x="45" y="325" width="220" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <rect x="55" y="335" width="130" height="20" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="120" y="349" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">query_log.txt (6 Queries)</text>
  <text x="55" y="375" fill="#f1f5f9" font-size="13" font-weight="700">3 vs 3 Benchmark Suite</text>
  <text x="55" y="395" fill="#f87171" font-size="11" font-weight="600">Cat A: ES Wins (Stem/OR/Stop)</text>
  <text x="55" y="412" fill="#94a3b8" font-size="10">A1: replicating cache nodes</text>
  <text x="55" y="428" fill="#94a3b8" font-size="10">A2: redis cache sharding</text>
  <text x="55" y="448" fill="#34d399" font-size="11" font-weight="600">Cat B: Custom Wins (Hyphen/RAM)</text>
  <text x="55" y="465" fill="#94a3b8" font-size="10">B1: in-memory key-value</text>

  <!-- Box 1.3: Relevance Judgments -->
  <rect x="45" y="505" width="220" height="145" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <rect x="55" y="515" width="160" height="20" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="135" y="529" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">relevance_judgments.json</text>
  <text x="55" y="555" fill="#f1f5f9" font-size="13" font-weight="700">Relevance Ground Truth</text>
  <text x="55" y="575" fill="#94a3b8" font-size="11">Graded Human Annotations</text>
  <text x="55" y="593" fill="#cbd5e1" font-size="10">Grade 2: Highly Relevant</text>
  <text x="55" y="609" fill="#cbd5e1" font-size="10">Grade 1: Partially Relevant</text>
  <text x="55" y="625" fill="#cbd5e1" font-size="10">Grade 0: Irrelevant</text>

  <!-- SECTION 2: Dual Search Engines (Middle Column) -->
  <!-- Upper Half: Custom Inverted Index (Emerald) -->
  <rect x="330" y="105" width="480" height="265" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#dropGlow)"/>
  <rect x="345" y="120" width="450" height="32" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="570" y="141" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Engine A: Custom Homemade Inverted Index (Module 16a-L1)</text>

  <rect x="350" y="165" width="135" height="185" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="417" y="190" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">TextAnalyzer</text>
  <text x="360" y="215" fill="#94a3b8" font-size="10">Regex Tokenizer:</text>
  <text x="360" y="230" fill="#e2e8f0" font-size="9" font-family="monospace">\b[a-zA-Z0-9_-]+\b</text>
  <text x="360" y="255" fill="#94a3b8" font-size="10">Preserves hyphens:</text>
  <text x="360" y="270" fill="#6ee7b7" font-size="9">in-memory, key-value</text>
  <text x="360" y="295" fill="#f87171" font-size="10">No Stemmer</text>
  <text x="360" y="310" fill="#94a3b8" font-size="9">replicate != replicating</text>

  <rect x="500" y="165" width="135" height="185" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="567" y="190" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">InvertedIndex</text>
  <text x="510" y="215" fill="#94a3b8" font-size="10">In-Memory Dict:</text>
  <text x="510" y="230" fill="#e2e8f0" font-size="9" font-family="monospace">term -&gt; [(doc,tf)]</text>
  <text x="510" y="255" fill="#94a3b8" font-size="10">Posting Lists:</text>
  <text x="510" y="270" fill="#cbd5e1" font-size="9">Strictly sorted doc_ids</text>
  <text x="510" y="295" fill="#94a3b8" font-size="10">Doc Lengths:</text>
  <text x="510" y="310" fill="#cbd5e1" font-size="9">Table for avgdl calc</text>

  <rect x="650" y="165" width="145" height="185" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="722" y="190" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">SearchRanker</text>
  <text x="660" y="215" fill="#94a3b8" font-size="10">Two-Pointer AND:</text>
  <text x="660" y="230" fill="#e2e8f0" font-size="9">Strict intersection</text>
  <text x="660" y="255" fill="#94a3b8" font-size="10">BM25 Scoring:</text>
  <text x="660" y="270" fill="#e2e8f0" font-size="9">Exact 64-bit float IDF</text>
  <text x="660" y="295" fill="#38bdf8" font-size="10" font-weight="600">Latency: 0.02ms</text>
  <text x="660" y="310" fill="#94a3b8" font-size="9">Zero serialization</text>

  <!-- Lower Half: Elasticsearch in Docker (Blue) -->
  <rect x="330" y="390" width="480" height="280" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropGlow)"/>
  <rect x="345" y="405" width="450" height="32" rx="6" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="1"/>
  <text x="570" y="426" fill="#bfdbfe" font-size="13" font-weight="700" text-anchor="middle">Engine B: Production Elasticsearch (Docker Container)</text>

  <rect x="350" y="450" width="135" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="417" y="475" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">Multi-Fields</text>
  <text x="360" y="500" fill="#94a3b8" font-size="10">content:</text>
  <text x="360" y="515" fill="#e2e8f0" font-size="9">Standard analyzer</text>
  <text x="360" y="535" fill="#94a3b8" font-size="10">content.english:</text>
  <text x="360" y="550" fill="#38bdf8" font-size="9">Porter stem + stopwords</text>
  <text x="360" y="570" fill="#94a3b8" font-size="10">content.exact:</text>
  <text x="360" y="585" fill="#e2e8f0" font-size="9">Regex hyphen pattern</text>
  <text x="360" y="615" fill="#fbbf24" font-size="10">NRT Refresh Gate</text>
  <text x="360" y="630" fill="#94a3b8" font-size="9">Explicit segment commit</text>

  <rect x="500" y="450" width="135" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="567" y="475" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">Lucene Core</text>
  <text x="510" y="500" fill="#94a3b8" font-size="10">Storage Engines:</text>
  <text x="510" y="515" fill="#e2e8f0" font-size="9">1. Postings (.tim/.doc)</text>
  <text x="510" y="530" fill="#e2e8f0" font-size="9">2. Doc Values (.dvd)</text>
  <text x="510" y="545" fill="#e2e8f0" font-size="9">3. Stored JSON (.fdt)</text>
  <text x="510" y="570" fill="#94a3b8" font-size="10">Immutable Segments:</text>
  <text x="510" y="585" fill="#cbd5e1" font-size="9">TieredMergePolicy</text>
  <text x="510" y="605" fill="#94a3b8" font-size="10">Deleted docs:</text>
  <text x="510" y="620" fill="#f87171" font-size="9">.del bitmap mask</text>

  <rect x="650" y="450" width="145" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="722" y="475" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">Disjunctive BM25</text>
  <text x="660" y="500" fill="#94a3b8" font-size="10">Candidate Retrieval:</text>
  <text x="660" y="515" fill="#e2e8f0" font-size="9">Boolean OR union</text>
  <text x="660" y="530" fill="#38bdf8" font-size="9">WAND top-K pruning</text>
  <text x="660" y="555" fill="#94a3b8" font-size="10">Scoring Engine:</text>
  <text x="660" y="570" fill="#e2e8f0" font-size="9">Byte-encoded norms</text>
  <text x="660" y="595" fill="#fbbf24" font-size="10" font-weight="600">Latency: 3.0-3.6ms</text>
  <text x="660" y="610" fill="#94a3b8" font-size="9">HTTP/REST round-trip</text>

  <!-- SECTION 3: Evaluation & Benchmarking (Right Column) -->
  <rect x="850" y="105" width="360" height="565" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#dropGlow)"/>
  <rect x="865" y="120" width="330" height="32" rx="6" fill="#3b0764" stroke="#7c3aed" stroke-width="1"/>
  <text x="1030" y="141" fill="#e9d5ff" font-size="13" font-weight="700" text-anchor="middle">3. Benchmark &amp; IR Evaluation Suite</text>

  <!-- Box 3.1: benchmark.py runner -->
  <rect x="865" y="165" width="330" height="145" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <rect x="875" y="175" width="130" height="20" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="940" y="189" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">benchmark.py Runner</text>
  <text x="875" y="215" fill="#f1f5f9" font-size="13" font-weight="700">Shootout Orchestration</text>
  <text x="875" y="235" fill="#94a3b8" font-size="11">Dispatches each query to both engines</text>
  <text x="875" y="253" fill="#94a3b8" font-size="11">Records nanosecond execution latency</text>
  <text x="875" y="271" fill="#94a3b8" font-size="11">Compares Lucene _explain with Custom</text>
  <text x="875" y="291" fill="#38bdf8" font-size="10" font-family="monospace">Outputs shootout_results.txt</text>

  <!-- Box 3.2: evaluator.py metrics -->
  <rect x="865" y="325" width="330" height="175" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <rect x="875" y="335" width="130" height="20" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="940" y="349" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">evaluator.py Suite</text>
  <text x="875" y="375" fill="#f1f5f9" font-size="13" font-weight="700">Quantitative IR Metrics</text>
  <text x="875" y="398" fill="#e2e8f0" font-size="11">Precision@k = (Relevant in top k) / k</text>
  <text x="875" y="416" fill="#e2e8f0" font-size="11">Recall@k = (Relevant in top k) / |Rel|</text>
  <text x="875" y="434" fill="#e2e8f0" font-size="11">Reciprocal Rank (RR) = 1 / first_rel</text>
  <text x="875" y="452" fill="#e2e8f0" font-size="11">Average Precision (AP) = Area under PR</text>
  <text x="875" y="474" fill="#a78bfa" font-size="11" font-weight="600">Macro: MAP (Mean AP) &amp; MRR (Mean RR)</text>

  <!-- Box 3.3: Empirical Outcome Summary -->
  <rect x="865" y="515" width="330" height="135" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="875" y="540" fill="#f1f5f9" font-size="12" font-weight="700">Empirical Shootout Verdict</text>
  <text x="875" y="562" fill="#34d399" font-size="10" font-weight="600">Homemade Index:</text>
  <text x="975" y="562" fill="#cbd5e1" font-size="10">0.02ms Latency | MAP: 0.4167</text>
  <text x="875" y="582" fill="#60a5fa" font-size="10" font-weight="600">ES (English + Stem):</text>
  <text x="990" y="582" fill="#cbd5e1" font-size="10">3.07ms Latency | MAP: 0.8472</text>
  <text x="875" y="602" fill="#fbbf24" font-size="10" font-weight="600">Trade-Off Axiom:</text>
  <text x="875" y="620" fill="#94a3b8" font-size="9.5">RAM speed &amp; hyphen precision vs. linguistic recall &amp; scale</text>

  <!-- CONNECTOR FLOW ARROWS -->
  <!-- Corpus to Homemade Inverted Index -->
  <path d="M 265 235 L 330 235" class="flow-line-emerald" marker-end="url(#arrowEmerald)"/>

  <!-- Corpus to Elasticsearch Docker -->
  <path d="M 265 245 C 295 245, 295 530, 330 530" class="flow-line-blue" marker-end="url(#arrowBlue)"/>

  <!-- Benchmark queries to Benchmark Runner -->
  <path d="M 265 405 C 300 405, 300 80, 840 80 C 840 80, 860 80, 865 220" class="flow-line-purple" marker-end="url(#arrowPurple)"/>

  <!-- Relevance judgments to Evaluator -->
  <path d="M 265 580 C 300 580, 300 680, 840 680 C 840 680, 860 680, 865 410" class="flow-line-purple" marker-end="url(#arrowPurple)"/>

  <!-- Homemade Engine to Benchmark Runner -->
  <path d="M 795 235 L 865 235" class="flow-line-emerald" marker-end="url(#arrowEmerald)"/>

  <!-- Elasticsearch to Benchmark Runner -->
  <path d="M 795 530 C 825 530, 825 260, 865 260" class="flow-line-blue" marker-end="url(#arrowBlue)"/>

  <!-- Benchmark Runner down to Evaluator and Verdict -->
  <path d="M 1030 310 L 1030 325" class="solid-line" marker-end="url(#arrowPurple)"/>
  <path d="M 1030 500 L 1030 515" class="solid-line" marker-end="url(#arrowPurple)"/>
</svg>
