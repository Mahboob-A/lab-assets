<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #0F172A; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .bold-text { font-weight: 600; fill: #1E293B; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .flow-line { stroke: #2563EB; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .flow-line-green { stroke: #059669; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .solid-line { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="520" class="bg"/>
  <rect x="20" y="20" width="920" height="480" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Title Banner -->
  <text x="480" y="55" text-anchor="middle" class="title-text">Real-Time Frequency Decay &amp; Atomic RCU Pointer Swap</text>
  <text x="480" y="78" text-anchor="middle" class="subtitle-text">Off-path streaming aggregation via Kafka and Flink with lock-free atomic index swaps.</text>

  <!-- Section 1: Streaming Frequency Decay Pipeline -->
  <g transform="translate(50, 105)">
    <rect width="860" height="150" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
    <text x="20" y="28" class="bold-text" fill="#1E40AF" font-size="13">ASYNC WRITE PIPELINE: TIME-DECAY STREAM PROCESSING</text>

    <!-- Kafka Event Stream -->
    <g transform="translate(20, 45)">
      <rect width="180" height="85" class="card" stroke="#3B82F6"/>
      <text x="90" y="22" text-anchor="middle" class="bold-text" font-size="11">Search Event Stream</text>
      <text x="12" y="42" class="mono-text">Apache Kafka Topic:</text>
      <text x="12" y="58" class="mono-text" fill="#2563EB">"search-queries-log"</text>
      <text x="12" y="74" class="subtitle-text">50k events/sec off read path</text>
    </g>

    <path d="M 200 87 L 245 87" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Apache Flink Stream Worker -->
    <g transform="translate(255, 45)">
      <rect width="260" height="85" class="card" stroke="#64748B"/>
      <text x="130" y="22" text-anchor="middle" class="bold-text" font-size="11">Flink Stateful Streaming</text>
      <text x="12" y="42" class="mono-text">Score = Sum(Count * e^(-lambda*dt))</text>
      <text x="12" y="58" class="body-text">5-Minute Tumbling Windows</text>
      <text x="12" y="74" class="mono-text" fill="#D97706">Decays stale trends automatically</text>
    </g>

    <path d="M 515 87 L 560 87" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Aggregated Frequency DB -->
    <g transform="translate(570, 45)">
      <rect width="270" height="85" class="card" stroke="#10B981"/>
      <text x="135" y="22" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">Frequency Store (Redis / DB)</text>
      <text x="12" y="42" class="mono-text">ZSET: query_frequencies</text>
      <text x="12" y="58" class="body-text">Normalized weights: 0.0 to 100,000</text>
      <text x="12" y="74" class="badge-text" fill="#059669">Single Source of Ranking Truth</text>
    </g>
  </g>

  <!-- Connector Down to Offline Index Builder -->
  <path d="M 705 255 L 705 285 L 200 285 L 200 310" class="flow-line-green" marker-end="url(#arrow-green)"/>
  <text x="440" y="280" text-anchor="middle" class="mono-text" fill="#059669">Periodic Snapshot Trigger (Every 2 Hours)</text>

  <!-- Section 2: Zero-Lock RCU Double Buffering -->
  <g transform="translate(50, 315)">
    <rect width="860" height="165" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" rx="10"/>
    <text x="20" y="26" class="bold-text" fill="#1E40AF" font-size="13">READ-COPY-UPDATE (RCU) ZERO-LOCK ATOMIC POINTER SWAP</text>

    <!-- Offline Builder -->
    <g transform="translate(20, 42)">
      <rect width="220" height="105" class="card" stroke="#3B82F6"/>
      <text x="110" y="20" text-anchor="middle" class="bold-text" font-size="11">Background Index Builder</text>
      <text x="12" y="40" class="body-text">• Reads frequency snapshot</text>
      <text x="12" y="58" class="body-text">• Builds new in-memory index</text>
      <text x="12" y="76" class="mono-text" fill="#2563EB">new_index = HashHeapService()</text>
      <text x="12" y="94" class="subtitle-text">Execution: Zero read lock impact</text>
    </g>

    <path d="M 240 94 L 285 94" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Pointer Swap Box -->
    <g transform="translate(295, 42)">
      <rect width="250" height="105" fill="#FFFFFF" stroke="#059669" stroke-width="2" rx="8"/>
      <text x="125" y="20" text-anchor="middle" class="bold-text" fill="#065F46" font-size="12">ATOMIC POINTER SWAP</text>
      <text x="12" y="42" class="mono-text" fill="#1E293B"># Atomic single CPU instruction:</text>
      <text x="12" y="60" class="mono-text" fill="#059669" font-weight="700">active_index = new_index</text>
      <text x="12" y="80" class="body-text">• Swap duration: &lt; 10 nanoseconds</text>
      <text x="12" y="96" class="body-text">• No mutex locks. No read pauses.</text>
    </g>

    <path d="M 545 94 L 590 94" class="flow-line-green" marker-end="url(#arrow-green)"/>

    <!-- Active Search Workers -->
    <g transform="translate(600, 42)">
      <rect width="240" height="105" class="card" stroke="#10B981"/>
      <text x="120" y="20" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">Active Search Workers</text>
      <text x="12" y="40" class="body-text">• Live queries read active_index</text>
      <text x="12" y="58" class="body-text">• Instant access to fresh rankings</text>
      <text x="12" y="76" class="mono-text" fill="#059669">p99 Latency: 0.05 ms steady</text>
      <text x="12" y="94" class="subtitle-text">Old index GC'd when readers finish</text>
    </g>
  </g>
</svg>
