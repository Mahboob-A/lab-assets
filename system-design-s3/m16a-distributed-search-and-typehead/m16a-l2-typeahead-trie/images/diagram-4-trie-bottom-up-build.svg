<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #0F172A; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .bold-text { font-weight: 600; fill: #1E293B; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .node-blue { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .node-green { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-amber { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .flow-line-up { stroke: #059669; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .solid-line { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="540" class="bg"/>
  <rect x="20" y="20" width="920" height="500" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Title Banner -->
  <text x="480" y="55" text-anchor="middle" class="title-text">Post-Order Bottom-Up Top-K Construction &amp; The Self-Ending Word Trap</text>
  <text x="480" y="78" text-anchor="middle" class="subtitle-text">Leaves bubble their Top-K candidates upward to parents. Parent merges children's lists plus its own word.</text>

  <!-- Algorithm Flowchart Architecture -->
  <!-- Left Side: Visual Tree Merge -->
  <g transform="translate(60, 110)">
    <rect width="420" height="380" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
    <text x="210" y="30" text-anchor="middle" class="bold-text" fill="#1E293B" font-size="13">BOTTOM-UP RECURSIVE MERGE IN ACTION</text>

    <!-- Parent Node 'car' -->
    <g transform="translate(160, 60)">
      <circle cx="50" cy="30" r="24" class="node-amber"/>
      <text x="50" y="35" text-anchor="middle" class="bold-text" font-size="13">car</text>
      <text x="50" y="68" text-anchor="middle" class="mono-text" fill="#D97706">is_end: True (5000)</text>
    </g>

    <!-- Edge to Child 1: 'card' -->
    <line x1="180" y1="130" x2="110" y2="180" class="solid-line"/>
    <path d="M 110 180 L 175 135" class="flow-line-up" marker-end="url(#arrow-green)"/>

    <!-- Child 1: 'd' -> 'card' -->
    <g transform="translate(60, 190)">
      <circle cx="50" cy="25" r="20" class="node-blue"/>
      <text x="50" y="30" text-anchor="middle" class="bold-text" font-size="12">card</text>
      <rect x="5" y="55" width="90" height="35" class="card" stroke="#3B82F6"/>
      <text x="50" y="72" text-anchor="middle" class="mono-text" fill="#1E40AF">top_k:</text>
      <text x="50" y="84" text-anchor="middle" class="mono-text">("card", 4000)</text>
    </g>

    <!-- Edge to Child 2: 'care' -->
    <line x1="240" y1="130" x2="310" y2="180" class="solid-line"/>
    <path d="M 310 180 L 245 135" class="flow-line-up" marker-end="url(#arrow-green)"/>

    <!-- Child 2: 'e' -> 'care' -->
    <g transform="translate(260, 190)">
      <circle cx="50" cy="25" r="20" class="node-blue"/>
      <text x="50" y="30" text-anchor="middle" class="bold-text" font-size="12">care</text>
      <rect x="5" y="55" width="90" height="35" class="card" stroke="#3B82F6"/>
      <text x="50" y="72" text-anchor="middle" class="mono-text" fill="#1E40AF">top_k:</text>
      <text x="50" y="84" text-anchor="middle" class="mono-text">("career", 6500)</text>
    </g>

    <!-- Merged Result at 'car' Node -->
    <g transform="translate(50, 295)">
      <rect width="320" height="70" class="card" stroke="#059669" stroke-width="2"/>
      <rect width="320" height="22" fill="#ECFDF5" rx="6"/>
      <text x="160" y="16" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">Parent Node ('car') Cached Top-K Result:</text>
      <text x="20" y="38" class="mono-text" fill="#059669">1. "career" (6500) &lt;-- from child 'care'</text>
      <text x="20" y="52" class="mono-text" fill="#D97706">2. "car" (5000)    &lt;-- SELF-ENDING WORD!</text>
      <text x="20" y="66" class="mono-text" fill="#1E40AF">3. "card" (4000)   &lt;-- from child 'card'</text>
    </g>
  </g>

  <!-- Right Side: The Code & The Bug Trap -->
  <g transform="translate(510, 110)">
    <rect width="400" height="380" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
    <text x="200" y="30" text-anchor="middle" class="bold-text" fill="#0F172A" font-size="13">THE "SELF-ENDING WORD" BUG TRAP</text>

    <!-- Explanatory Alert Box -->
    <g transform="translate(25, 48)">
      <rect width="350" height="110" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" rx="6"/>
      <text x="15" y="24" class="bold-text" fill="#92400E" font-size="12">Warning: The Invisible Top-K Omission Bug</text>
      <text x="15" y="44" class="body-text">If your merge logic only scans `node.children.values()`,</text>
      <text x="15" y="62" class="body-text">a word that terminates at the current node is never added!</text>
      <text x="15" y="80" class="mono-text" fill="#B45309">Result: "car" is missing when user types "car"!</text>
      <text x="15" y="98" class="bold-text" fill="#059669">Fix: Check `if node.is_end: candidates[node.word] = freq`</text>
    </g>

    <!-- Code Walkthrough Container -->
    <g transform="translate(25, 175)">
      <rect width="350" height="185" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" rx="6"/>
      <text x="15" y="22" class="mono-text" fill="#94A3B8"># Post-order bottom-up construction</text>
      <text x="15" y="40" class="mono-text" fill="#38BDF8">for</text>
      <text x="42" y="40" class="mono-text" fill="#F8FAFC">child in node.children.values():</text>
      <text x="35" y="58" class="mono-text" fill="#F8FAFC">for q, freq in _post_order(child):</text>
      <text x="55" y="76" class="mono-text" fill="#F8FAFC">candidates[q] = max(candidates[q], freq)</text>
      <text x="15" y="100" class="mono-text" fill="#FCD34D"># CRITICAL FIX: Add self-ending word</text>
      <text x="15" y="118" class="mono-text" fill="#38BDF8">if</text>
      <text x="35" y="118" class="mono-text" fill="#F8FAFC">node.is_end and node.word:</text>
      <text x="35" y="136" class="mono-text" fill="#34D399">    candidates[node.word] = node.frequency</text>
      <text x="15" y="160" class="mono-text" fill="#94A3B8"># Sort descending and cache Top-K</text>
      <text x="15" y="176" class="mono-text" fill="#F8FAFC">node.top_k = sorted(candidates.items())[:k]</text>
    </g>
  </g>
</svg>
