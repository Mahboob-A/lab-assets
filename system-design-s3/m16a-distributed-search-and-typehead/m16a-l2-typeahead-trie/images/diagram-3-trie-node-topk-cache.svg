<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #0F172A; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .bold-text { font-weight: 600; fill: #1E293B; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .node-circle { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .node-cache { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-danger { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.5; stroke-dasharray: 4,2; }
      .flow-line-blue { stroke: #2563EB; stroke-width: 2; stroke-dasharray: 6,4; fill: none; animation: flow 1.5s linear infinite; }
      .flow-line-red { stroke: #DC2626; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="960" height="520" class="bg"/>
  <rect x="20" y="20" width="920" height="480" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="480" y="55" text-anchor="middle" class="title-text">Trie Query Performance: Subtree DFS vs. Node-Level Top-K Cache</text>
  <text x="480" y="78" text-anchor="middle" class="subtitle-text">Why runtime tree traversal violates the 50ms SLA, and how precomputed node caches solve it.</text>

  <!-- Left Side: Naive Subtree DFS -->
  <g transform="translate(50, 105)">
    <rect width="400" height="370" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5" rx="10"/>
    <text x="200" y="30" text-anchor="middle" class="bold-text" fill="#991B1B" font-size="14">NAIVE APPROACH: RUNTIME SUBTREE DFS</text>
    <text x="200" y="50" text-anchor="middle" class="mono-text" fill="#DC2626">O(L + Subtree Size) = Pointer Hell</text>

    <!-- Visual Trie Tree Branch -->
    <circle cx="200" cy="85" r="16" class="node-circle"/>
    <text x="200" y="90" text-anchor="middle" class="bold-text">sys</text>

    <!-- Branching lines down -->
    <line x1="188" y1="98" x2="110" y2="140" class="flow-line-red"/>
    <line x1="200" y1="101" x2="200" y2="140" class="flow-line-red"/>
    <line x1="212" y1="98" x2="290" y2="140" class="flow-line-red"/>

    <circle cx="110" cy="155" r="14" class="node-danger"/>
    <text x="110" y="159" text-anchor="middle" class="mono-text">t</text>

    <circle cx="200" cy="155" r="14" class="node-danger"/>
    <text x="200" y="159" text-anchor="middle" class="mono-text">c</text>

    <circle cx="290" cy="155" r="14" class="node-danger"/>
    <text x="290" y="159" text-anchor="middle" class="mono-text">i</text>

    <!-- Massive Subtree Explosion Box -->
    <g transform="translate(40, 190)">
      <rect width="320" height="85" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,2" rx="6"/>
      <text x="160" y="24" text-anchor="middle" class="bold-text" fill="#B91C1C" font-size="12">Traverse 100,000+ Subtree Nodes</text>
      <text x="160" y="44" text-anchor="middle" class="body-text">Recursively scan every letter, word, and leaf</text>
      <text x="160" y="64" text-anchor="middle" class="mono-text" fill="#DC2626">Severe CPU Cache Misses &amp; GC Pauses</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(40, 295)">
      <rect width="320" height="55" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="6"/>
      <text x="160" y="24" text-anchor="middle" class="bold-text" fill="#991B1B" font-size="13">Runtime: &gt; 50 ms (Violates SLA)</text>
      <text x="160" y="44" text-anchor="middle" class="mono-text" fill="#991B1B">Cannot sustain &gt; 200 QPS per core</text>
    </g>
  </g>

  <!-- Right Side: Node-Level Top-K Cache -->
  <g transform="translate(510, 105)">
    <rect width="400" height="370" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5" rx="10"/>
    <text x="200" y="30" text-anchor="middle" class="bold-text" fill="#065F46" font-size="14">OPTIMIZED: NODE-LEVEL TOP-K CACHE</text>
    <text x="200" y="50" text-anchor="middle" class="mono-text" fill="#059669">Strict O(L) Character Path Lookup</text>

    <!-- Visual Prefix Node with Attached Cache Card -->
    <g transform="translate(60, 75)">
      <circle cx="40" cy="40" r="22" class="node-cache"/>
      <text x="40" y="45" text-anchor="middle" class="bold-text" font-size="13">sys</text>

      <!-- Attached Cache Box -->
      <g transform="translate(80, 0)">
        <rect width="200" height="110" class="card" stroke="#10B981" stroke-width="2"/>
        <rect width="200" height="24" fill="#D1FAE5" rx="6"/>
        <text x="100" y="16" text-anchor="middle" class="bold-text" fill="#065F46" font-size="11">node.top_k Precomputed (K=5)</text>
        <text x="12" y="42" class="mono-text" fill="#1E293B">1. system design (9850)</text>
        <text x="12" y="60" class="mono-text" fill="#1E293B">2. system rate limit (8420)</text>
        <text x="12" y="78" class="mono-text" fill="#1E293B">3. system caching (7650)</text>
        <text x="12" y="96" class="mono-text" fill="#64748B">4. systemctl status (3120)</text>
      </g>
      <line x1="62" y1="40" x2="80" y2="40" stroke="#059669" stroke-width="2"/>
    </g>

    <!-- Traversal explanation -->
    <g transform="translate(40, 205)">
      <rect width="320" height="70" class="card" stroke="#10B981"/>
      <text x="160" y="24" text-anchor="middle" class="bold-text" fill="#065F46" font-size="12">Zero Subtree Traversal Needed</text>
      <text x="160" y="44" text-anchor="middle" class="body-text">Navigate 's' -&gt; 'y' -&gt; 's' in 3 memory hops</text>
      <text x="160" y="60" text-anchor="middle" class="mono-text" fill="#059669">Direct memory slice: return current.top_k[:5]</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(40, 295)">
      <rect width="320" height="55" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" rx="6"/>
      <text x="160" y="24" text-anchor="middle" class="bold-text" fill="#065F46" font-size="13">Runtime: 0.0007 ms (0.7 microseconds!)</text>
      <text x="160" y="44" text-anchor="middle" class="mono-text" fill="#047857">Sustains 2,800,000+ QPS per core!</text>
    </g>
  </g>
</svg>
