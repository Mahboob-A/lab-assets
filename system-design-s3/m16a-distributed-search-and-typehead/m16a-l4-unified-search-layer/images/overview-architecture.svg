<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .card-blue { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; rx: 8px; }
      .card-emerald { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.5; rx: 8px; }
      .card-amber { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.5; rx: 8px; }
      .card-rose { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5; rx: 8px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #0F172A; letter-spacing: -0.02em; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748B; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1E293B; }
      .conn { stroke: #94A3B8; stroke-width: 2; fill: none; stroke-linecap: round; }
      .conn-active { stroke: #2563EB; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; animation: flow 1.2s linear infinite; }
      .conn-fallback { stroke: #D97706; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; animation: flow 1.2s linear infinite; }
      .conn-emerald { stroke: #059669; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; animation: flow 1.2s linear infinite; }
      @keyframes flow {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Top Title Banner -->
  <g transform="translate(40, 30)">
    <text class="header-title" x="0" y="0">Unified Search Surface: Macro End-to-End Architecture</text>
    <text class="subtext" x="0" y="20">Interactive Client Dashboard &#8226; FastAPI Routing Gateway &#8226; Primary Elasticsearch &#8226; Zero-IPC RAM Fallback</text>
  </g>

  <!-- SECTION 1: Client Layer (Browser) -->
  <g transform="translate(40, 80)">
    <rect width="220" height="430" class="card" />
    <rect width="220" height="36" fill="#F1F5F9" rx="8" />
    <text class="title" x="14" y="23">Client Browser Surface</text>
    <circle cx="185" cy="18" r="4" fill="#EF4444" />
    <circle cx="197" cy="18" r="4" fill="#F59E0B" />
    <circle cx="209" cy="18" r="4" fill="#10B981" />

    <!-- Sub-card: Interactive Dashboard -->
    <rect x="14" y="52" width="192" height="110" class="card-blue" />
    <text class="title" x="24" y="74" fill="#1E40AF">Search Input Surface</text>
    <text class="subtext" x="24" y="92">Debounce Timer: 200ms</text>
    <text class="subtext" x="24" y="108">Prefix Gate: min_len &gt;= 2</text>
    <rect x="24" y="122" width="172" height="26" fill="#FFFFFF" stroke="#93C5FD" rx="4" />
    <text class="code-text" x="32" y="139" fill="#2563EB">sys| [Typeahead Dropdown]</text>

    <!-- Sub-card: Chrome DevTools Waterfall Inspector -->
    <rect x="14" y="178" width="192" height="150" class="card" />
    <text class="title" x="24" y="200">Waterfall Inspector</text>
    <text class="subtext" x="24" y="216">Hop-by-hop latency telemetry:</text>
    <line x1="24" y1="230" x2="196" y2="230" stroke="#E2E8F0" />
    <text class="code-text" x="24" y="248">&#8226; Debounce Wait: 200ms</text>
    <text class="code-text" x="24" y="268">&#8226; Network RTT: 1.8ms</text>
    <text class="code-text" x="24" y="288">&#8226; Server Execution:</text>
    <text class="code-text" x="34" y="306" fill="#059669">0.016ms (RAM) / 6.6ms (ES)</text>

    <!-- Chaos Buttons -->
    <rect x="14" y="344" width="192" height="150" fill="#F8FAFC" stroke="#E2E8F0" rx="6" />
    <text class="title" x="24" y="366">Chaos Injection Controls</text>
    <rect x="24" y="378" width="172" height="26" fill="#FEF2F2" stroke="#FCA5A5" rx="4" />
    <text class="badge-text" x="42" y="395" fill="#DC2626">Trip Circuit Breaker</text>
    <rect x="24" y="412" width="172" height="26" fill="#ECFDF5" stroke="#6EE7B7" rx="4" />
    <text class="badge-text" x="46" y="429" fill="#059669">Reset Circuit Breaker</text>
    <rect x="24" y="446" width="172" height="26" fill="#EFF6FF" stroke="#BFDBFE" rx="4" />
    <text class="badge-text" x="46" y="463" fill="#2563EB">Force RAM Fallback</text>
  </g>

  <!-- Connectors from Browser to Gateway -->
  <path d="M 260 180 L 330 180" class="conn-active" marker-end="url(#arrow-blue)" />
  <text class="code-text" x="268" y="172" fill="#2563EB">GET /suggest</text>

  <path d="M 260 270 L 330 270" class="conn-active" marker-end="url(#arrow-blue)" />
  <text class="code-text" x="270" y="262" fill="#2563EB">GET /search</text>

  <!-- SECTION 2: FastAPI Gateway Layer -->
  <g transform="translate(340, 80)">
    <rect width="250" height="430" class="card" />
    <rect width="250" height="36" fill="#F1F5F9" rx="8" />
    <text class="title" x="16" y="23">FastAPI Gateway Layer</text>

    <!-- Suggestion Route Handler -->
    <rect x="16" y="52" width="218" height="96" class="card-emerald" />
    <text class="title" x="26" y="74" fill="#065F46">Route: /suggest</text>
    <text class="subtext" x="26" y="92">1. Validates query length &gt;= 2</text>
    <text class="subtext" x="26" y="108">2. Queries In-Memory Trie</text>
    <text class="code-text" x="26" y="128" fill="#059669">Latency: ~0.016 ms (Heap)</text>

    <!-- Search Route Handler & Circuit Breaker -->
    <rect x="16" y="162" width="218" height="248" class="card-blue" />
    <text class="title" x="26" y="184" fill="#1E40AF">Route: /search</text>
    <text class="subtext" x="26" y="202">Protected by SearchCircuitBreaker</text>

    <!-- Inner FSM box -->
    <rect x="26" y="212" width="198" height="110" fill="#FFFFFF" stroke="#93C5FD" rx="6" />
    <text class="title" x="36" y="232" font-size="12px">Circuit State Machine (FSM)</text>
    <text class="code-text" x="36" y="252">&#8226; State: CLOSED / OPEN / HALF</text>
    <text class="code-text" x="36" y="270">&#8226; Failure Threshold: 3</text>
    <text class="code-text" x="36" y="288">&#8226; Latency SLA: 500 ms</text>
    <text class="code-text" x="36" y="306">&#8226; Cooldown Window: 10.0 s</text>

    <!-- Decision Router -->
    <rect x="26" y="332" width="198" height="66" fill="#F8FAFC" stroke="#CBD5E1" rx="4" />
    <text class="code-text" x="34" y="352">if state == CLOSED: Primary</text>
    <text class="code-text" x="34" y="372" fill="#D97706">elif OPEN: Instant RAM Fallback</text>
    <text class="code-text" x="34" y="390" fill="#2563EB">elif HALF_OPEN: Canary Probe</text>
  </g>

  <!-- Connectors from Gateway to Backends -->
  <!-- Top Branch: Trie Typeahead -->
  <path d="M 590 120 L 670 120" class="conn-emerald" marker-end="url(#arrow-emerald)" />
  <text class="code-text" x="602" y="112" fill="#059669">Zero-IPC</text>

  <!-- Middle Branch: Primary Elasticsearch -->
  <path d="M 590 240 L 670 240" class="conn-active" marker-end="url(#arrow-blue)" />
  <text class="code-text" x="602" y="232" fill="#2563EB">HTTP:9200</text>

  <!-- Bottom Branch: Fallback In-Memory Index -->
  <path d="M 590 400 L 670 400" class="conn-fallback" marker-end="url(#arrow-amber)" />
  <text class="code-text" x="600" y="392" fill="#D97706">Zero-IPC Heap</text>

  <!-- SECTION 3: Storage & Search Engines -->
  <!-- Box A: Trie Autocomplete -->
  <g transform="translate(680, 80)">
    <rect width="240" height="110" class="card-emerald" />
    <text class="title" x="16" y="26" fill="#065F46">Trie Typeahead Engine</text>
    <text class="subtext" x="16" y="44">Origin: Lab 2 Typeahead Architecture</text>
    <text class="code-text" x="16" y="66">&#8226; O(L) Prefix Character Traversal</text>
    <text class="code-text" x="16" y="84">&#8226; Precomputed Node Top-K Heap</text>
    <text class="code-text" x="16" y="102" fill="#059669">&#8226; Vocabulary: 165 Zipfian Queries</text>
  </g>

  <!-- Box B: Primary Elasticsearch -->
  <g transform="translate(680, 210)">
    <rect width="240" height="150" class="card-blue" />
    <text class="title" x="16" y="26" fill="#1E40AF">Primary: Elasticsearch 8.11.0</text>
    <text class="subtext" x="16" y="44">Origin: Lab 3 Production IR Engine</text>
    <text class="code-text" x="16" y="66">&#8226; Porter Stemmer (english analyzer)</text>
    <text class="code-text" x="16" y="84">&#8226; Lucene Block-Compressed Segments</text>
    <text class="code-text" x="16" y="102">&#8226; MAP Score: 0.8472 | P@1: 1.000</text>
    <text class="code-text" x="16" y="120" fill="#2563EB">&#8226; Steady Latency: 5.4 - 6.6 ms</text>
    <text class="code-text" x="16" y="138" fill="#64748B">&#8226; Vulnerability: Saturated cluster SLA</text>
  </g>

  <!-- Box C: Fallback In-Memory Index -->
  <g transform="translate(680, 380)">
    <rect width="240" height="130" class="card-amber" />
    <text class="title" x="16" y="26" fill="#92400E">Fallback: Inverted Index</text>
    <text class="subtext" x="16" y="44">Origin: Lab 1 In-Memory Index Engine</text>
    <text class="code-text" x="16" y="66">&#8226; Two-Pointer Boolean AND Scan</text>
    <text class="code-text" x="16" y="84">&#8226; In-Process Heap Posting Lists</text>
    <text class="code-text" x="16" y="102" fill="#D97706">&#8226; Fallback Latency: 0.02 - 0.05 ms</text>
    <text class="code-text" x="16" y="120">&#8226; MAP Score: 0.4167 (Tradeoff)</text>
  </g>
</svg>
