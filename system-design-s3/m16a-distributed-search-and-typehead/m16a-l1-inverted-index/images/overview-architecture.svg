<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 540" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1520" height="540" fill="#F8FAFC" rx="16"/>
  <rect x="1" y="1" width="1518" height="538" fill="none" stroke="#E2E8F0" stroke-width="2" rx="16"/>

  <!-- Diagram Title Header -->
  <text x="760" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Search Engine Architecture: Inverted Index &amp; BM25 Relevance Engine</text>
  <text x="760" y="56" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">Module 16a Lab 1 — Ingestion Pipeline (Build Time) vs. Retrieval Pipeline (Query Time)</text>

  <!-- ============================================================== -->
  <!-- 1. LEFT SECTION: INGESTION & INDEXING FLOW (BUILD TIME)        -->
  <!-- ============================================================== -->
  <rect x="35" y="75" width="580" height="435" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" rx="12"/>
  <rect x="50" y="65" width="280" height="22" fill="#2563EB" rx="6"/>
  <text x="190" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">1. INGESTION &amp; INDEXING FLOW (BUILD TIME)</text>

  <!-- Box 1: Raw Documents (corpus.py) -->
  <g filter="url(#shadow)">
    <rect x="55" y="105" width="225" height="165" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" rx="10"/>
    <rect x="55" y="105" width="225" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 55 129 H 280 V 139 H 55 Z" fill="#F1F5F9"/>
    <text x="70" y="127" font-size="13" font-weight="700" fill="#1E293B">Raw Documents</text>
    <rect x="205" y="112" width="65" height="18" fill="#E2E8F0" rx="4"/>
    <text x="237" y="125" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">corpus.py</text>

    <text x="70" y="157" font-size="11" font-weight="600" fill="#334155">9 Distributed Docs:</text>
    <text x="70" y="175" font-size="10" fill="#64748B">• Doc 1: Redis cache (15w)</text>
    <text x="70" y="191" font-size="10" fill="#64748B">• Doc 2: Raft consensus</text>
    <text x="70" y="207" font-size="10" fill="#64748B">• Doc 3: Cache sharding</text>
    <text x="70" y="223" font-size="10" fill="#64748B">• Doc 9: Rambling doc (41w)</text>
    <rect x="70" y="238" width="195" height="22" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" rx="6"/>
    <text x="167" y="253" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563EB">Unstructured Text Strings</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 280 185 L 340 185" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 280 185 L 335 185" class="base-line flow-blue"/>
  <text x="310" y="177" text-anchor="middle" font-size="9" font-weight="600" fill="#2563EB">Raw Text</text>

  <!-- Box 2: Text Analyzer (analyzer.py) -->
  <g filter="url(#shadow)">
    <rect x="345" y="105" width="250" height="165" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="10"/>
    <rect x="345" y="105" width="250" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 345 129 H 595 V 139 H 345 Z" fill="#DBEAFE"/>
    <text x="360" y="127" font-size="13" font-weight="700" fill="#1E40AF">Text Analyzer</text>
    <rect x="510" y="112" width="75" height="18" fill="#BFDBFE" rx="4"/>
    <text x="547" y="125" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF">analyzer.py</text>

    <text x="360" y="157" font-size="10" font-weight="600" fill="#1E3A8A">1. Regex Tokenizer (word boundaries)</text>
    <text x="360" y="175" font-size="10" font-weight="600" fill="#1E3A8A">2. Case Folding ("Redis" ──▶ "redis")</text>
    <text x="360" y="193" font-size="10" font-weight="600" fill="#1E3A8A">3. Stop Words (filter {"the", "is", "at"})</text>
    <rect x="360" y="215" width="220" height="42" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" rx="6"/>
    <text x="370" y="231" font-size="9" font-weight="700" fill="#1D4ED8">Output: Clean Token Stream</text>
    <text x="370" y="247" font-size="8.5" fill="#64748B">Normalized terms for indexation</text>
  </g>

  <!-- Flow Connector 2 -> 3 (Downward into Inverted Index) -->
  <path d="M 470 270 L 470 295" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 470 270 L 470 290" class="base-line flow-blue"/>
  <text x="495" y="286" font-size="9" font-weight="600" fill="#2563EB">Tokens</text>

  <!-- Box 3: Inverted Index Storage (index.py) -->
  <g filter="url(#shadow)">
    <rect x="55" y="300" width="540" height="195" fill="#F0FDF4" stroke="#059669" stroke-width="2" rx="10"/>
    <rect x="55" y="300" width="540" height="34" fill="#DCFCE7" rx="10"/>
    <path d="M 55 324 H 595 V 334 H 55 Z" fill="#DCFCE7"/>
    <text x="70" y="322" font-size="13" font-weight="700" fill="#14532D">Inverted Index Data Structure</text>
    <rect x="515" y="307" width="70" height="18" fill="#BBF7D0" rx="4"/>
    <text x="550" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#14532D">index.py</text>

    <!-- Sub-table Lexicon -->
    <rect x="70" y="342" width="220" height="112" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" rx="6"/>
    <text x="180" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">Lexicon / Dictionary (RAM)</text>
    <line x1="70" y1="365" x2="290" y2="365" stroke="#DCFCE7"/>
    <text x="80" y="381" font-size="9" font-weight="600" fill="#334155">• "cache"</text>
    <text x="250" y="381" font-size="9" fill="#15803D">DF: 2 ──▶</text>
    <text x="80" y="401" font-size="9" font-weight="600" fill="#334155">• "consensus"</text>
    <text x="250" y="401" font-size="9" fill="#15803D">DF: 1 ──▶</text>
    <text x="80" y="421" font-size="9" font-weight="600" fill="#334155">• "distributed"</text>
    <text x="250" y="421" font-size="9" fill="#15803D">DF: 3 ──▶</text>
    <text x="80" y="445" font-size="8.5" font-weight="600" fill="#64748B">O(1) Hash Map / FST Lookup</text>

    <!-- Sub-table Postings -->
    <rect x="300" y="342" width="280" height="112" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" rx="6"/>
    <text x="440" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">Posting Lists (Sorted DocIDs)</text>
    <line x1="300" y1="365" x2="580" y2="365" stroke="#DCFCE7"/>
    <text x="310" y="381" font-size="8.8" fill="#166534">[(Doc 1, tf=2), (Doc 3, tf=1)]</text>
    <text x="310" y="401" font-size="8.8" fill="#166534">[(Doc 2, tf=1)]</text>
    <text x="310" y="421" font-size="8.8" fill="#166534">[(Doc 1, tf=2), (Doc 3, tf=1), (Doc 9, tf=5)]</text>
    <text x="310" y="445" font-size="8.5" font-weight="600" fill="#64748B">Delta Gap Compressed in Storage</text>

    <!-- Bottom Stat Pill -->
    <rect x="70" y="464" width="510" height="22" fill="#DCFCE7" rx="6"/>
    <text x="325" y="479" text-anchor="middle" font-size="9.5" font-weight="600" fill="#14532D">Collection Statistics: avgdl = 26.22 words  |  N = 9 Total Documents</text>
  </g>

  <!-- ============================================================== -->
  <!-- 2. RIGHT SECTION: SEARCH & RETRIEVAL FLOW (QUERY TIME)         -->
  <!-- ============================================================== -->
  <rect x="645" y="75" width="840" height="435" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" rx="12"/>
  <rect x="660" y="65" width="280" height="22" fill="#2563EB" rx="6"/>
  <text x="800" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">2. SEARCH &amp; RETRIEVAL FLOW (QUERY TIME)</text>

  <!-- Box 4: User Search Query -->
  <g filter="url(#shadow)">
    <rect x="665" y="105" width="180" height="165" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" rx="10"/>
    <rect x="665" y="105" width="180" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 665 129 H 845 V 139 H 665 Z" fill="#F1F5F9"/>
    <text x="677" y="127" font-size="12" font-weight="700" fill="#1E293B">User Search Query</text>
    <rect x="790" y="112" width="48" height="18" fill="#E2E8F0" rx="4"/>
    <text x="814" y="125" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Online</text>

    <text x="677" y="157" font-size="10" font-weight="600" fill="#334155">Search String:</text>
    <rect x="677" y="167" width="156" height="28" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
    <text x="687" y="185" font-size="10.5" font-family="monospace" font-weight="700" fill="#2563EB">"distributed cache"</text>
    <text x="677" y="215" font-size="9" fill="#64748B">• Multi-term Boolean</text>
    <text x="677" y="232" font-size="9" fill="#64748B">• Sub-millisecond target</text>
  </g>

  <!-- Flow Connector 4 -> 5 -->
  <path d="M 845 180 L 870 180" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 845 180 L 865 180" class="base-line flow-blue"/>
  <text x="857" y="172" text-anchor="middle" font-size="8.5" font-weight="600" fill="#2563EB">Query</text>

  <!-- Box 5: Query Analyzer -->
  <g filter="url(#shadow)">
    <rect x="875" y="105" width="180" height="165" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="10"/>
    <rect x="875" y="105" width="180" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 875 129 H 1055 V 139 H 875 Z" fill="#DBEAFE"/>
    <text x="887" y="127" font-size="12" font-weight="700" fill="#1E40AF">Query Analyzer</text>
    <rect x="990" y="112" width="58" height="18" fill="#BFDBFE" rx="4"/>
    <text x="1019" y="125" text-anchor="middle" font-size="8" font-weight="700" fill="#1E40AF">Same Rule</text>

    <text x="887" y="157" font-size="10" font-weight="600" fill="#1E3A8A">Query Tokens:</text>
    <rect x="887" y="167" width="156" height="28" fill="#FFFFFF" stroke="#93C5FD" rx="6"/>
    <text x="895" y="185" font-size="9.5" font-family="monospace" font-weight="700" fill="#1D4ED8">[distributed, cache]</text>
    <text x="887" y="215" font-size="9" fill="#3B82F6">• Case folded</text>
    <text x="887" y="232" font-size="9" fill="#3B82F6">• Zero stop words</text>
  </g>

  <!-- Flow Connector 5 -> 6 -->
  <path d="M 1055 180 L 1080 180" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 1055 180 L 1075 180" class="base-line flow-blue"/>
  <text x="1067" y="172" text-anchor="middle" font-size="8.5" font-weight="600" fill="#2563EB">Tokens</text>

  <!-- Box 6: Stage 1 Candidate Matcher -->
  <g filter="url(#shadow)">
    <rect x="1085" y="105" width="185" height="165" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" rx="10"/>
    <rect x="1085" y="105" width="185" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 1085 129 H 1270 V 139 H 1085 Z" fill="#DBEAFE"/>
    <text x="1097" y="127" font-size="11.5" font-weight="700" fill="#1E40AF">Stage 1: Matcher</text>
    <rect x="1215" y="112" width="48" height="18" fill="#2563EB" rx="4"/>
    <text x="1239" y="125" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">&lt; 2ms</text>

    <text x="1097" y="157" font-size="9.5" font-weight="700" fill="#1E3A8A">Two-Pointer AND</text>
    <text x="1097" y="174" font-size="8.8" fill="#334155">• Single-pass list walk</text>
    <text x="1097" y="190" font-size="8.8" fill="#334155">• O(L_A + L_B) complexity</text>
    <rect x="1097" y="208" width="161" height="24" fill="#FFFFFF" stroke="#3B82F6" rx="6"/>
    <text x="1177" y="224" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">Docs: [1, 3, 9]</text>
    <text x="1097" y="250" font-size="8.5" fill="#64748B">Discards non-matches</text>
  </g>

  <!-- Flow Connector 6 -> 7 -->
  <path d="M 1270 180 L 1295 180" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 1270 180 L 1290 180" class="base-line flow-blue"/>
  <text x="1282" y="172" text-anchor="middle" font-size="8.5" font-weight="600" fill="#2563EB">Candidates</text>

  <!-- Box 7: Stage 2 BM25 Scorer -->
  <g filter="url(#shadow)">
    <rect x="1300" y="105" width="170" height="165" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" rx="10"/>
    <rect x="1300" y="105" width="170" height="34" fill="#DBEAFE" rx="10"/>
    <path d="M 1300 129 H 1470 V 139 H 1300 Z" fill="#DBEAFE"/>
    <text x="1312" y="127" font-size="11.5" font-weight="700" fill="#1E40AF">Stage 2: BM25</text>
    <rect x="1410" y="112" width="52" height="18" fill="#2563EB" rx="4"/>
    <text x="1436" y="125" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Rank</text>

    <text x="1312" y="157" font-size="9.5" font-weight="700" fill="#1E3A8A">Okapi Formula</text>
    <text x="1312" y="174" font-size="8.8" fill="#334155">• Saturation (k1=1.2)</text>
    <text x="1312" y="190" font-size="8.8" fill="#334155">• Length Norm (b=0.75)</text>
    <text x="1312" y="206" font-size="8.8" fill="#334155">• Penalizes verbosity</text>
    <rect x="1312" y="222" width="146" height="24" fill="#FFFFFF" stroke="#3B82F6" rx="6"/>
    <text x="1385" y="238" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">Sorted by Score ──▶</text>
  </g>

  <!-- Flow Connector 7 -> 8 (Downward into Top-K Results) -->
  <path d="M 1385 270 L 1385 300" class="base-line" stroke="#86EFAC" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 1385 270 L 1385 295" class="base-line flow-green"/>
  <text x="1412" y="288" font-size="8.5" font-weight="700" fill="#059669">Ranked</text>

  <!-- Bridge Connector: Inverted Index (Card 3) -> Candidate Matcher (Card 6) -->
  <path d="M 595 370 C 625 370, 635 292, 665 292 L 1177 292 L 1177 275" class="base-line" stroke="#86EFAC" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 595 370 C 625 370, 635 292, 665 292 L 1177 292 L 1177 275" class="base-line flow-green"/>
  <g>
    <rect x="760" y="282" width="110" height="20" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" rx="4"/>
    <text x="815" y="295" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D">Lookup Postings</text>
  </g>

  <!-- Explanatory Card: The Iron Rule of Search Systems -->
  <g filter="url(#shadow)">
    <rect x="665" y="305" width="390" height="190" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" rx="10"/>
    <rect x="665" y="305" width="390" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 665 329 H 1055 V 339 H 665 Z" fill="#F1F5F9"/>
    <text x="680" y="327" font-size="12" font-weight="700" fill="#1E293B">The Iron Rule of Search Systems</text>
    <rect x="975" y="312" width="70" height="18" fill="#E2E8F0" rx="4"/>
    <text x="1010" y="325" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Principle</text>

    <text x="680" y="357" font-size="10" font-weight="700" fill="#0F172A">Symmetric Document &amp; Query Pipeline:</text>
    <text x="680" y="375" font-size="9" fill="#475569">• Ingestion &amp; Search MUST use identical Text Analyzer steps.</text>
    <text x="680" y="393" font-size="9" fill="#475569">• Mismatched tokenizers cause silent query recall failure.</text>
    <text x="680" y="411" font-size="9" fill="#475569">• analyzer.py shared code guarantees vocabulary parity.</text>

    <rect x="680" y="428" width="360" height="52" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" rx="6"/>
    <text x="690" y="445" font-size="9" font-weight="700" fill="#1E40AF">Two-Stage Efficiency Guarantee:</text>
    <text x="690" y="462" font-size="8.5" fill="#2563EB">Fast Boolean intersection prunes corpus to 3 candidates (&lt; 2ms);</text>
    <text x="690" y="474" font-size="8.5" fill="#2563EB">costly BM25 scoring only executes on relevant subset.</text>
  </g>

  <!-- Box 8: Final Top-K Ranked Output -->
  <g filter="url(#shadow)">
    <rect x="1075" y="305" width="395" height="190" fill="#ECFDF5" stroke="#059669" stroke-width="2" rx="10"/>
    <rect x="1075" y="305" width="105" height="190" fill="#DCFCE7" rx="10"/>
    <path d="M 1170 305 H 1180 V 495 H 1170 Z" fill="#DCFCE7"/>
    <text x="1127" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">TOP-K</text>
    <text x="1127" y="408" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">RESULTS</text>

    <text x="1195" y="335" font-size="10.5" font-weight="700" fill="#065F46">Rank 1: Doc 1  (BM25: 2.18)</text>
    <text x="1195" y="352" font-size="9" font-weight="600" fill="#059669">──▶ Concise, high density [WINNER]</text>

    <text x="1195" y="380" font-size="10.5" font-weight="700" fill="#047857">Rank 2: Doc 3  (BM25: 1.84)</text>
    <text x="1195" y="397" font-size="9" fill="#475569">──▶ Moderate length match</text>

    <text x="1195" y="425" font-size="10.5" font-weight="700" fill="#065F46">Rank 3: Doc 9  (BM25: 1.25)</text>
    <text x="1195" y="442" font-size="9" fill="#64748B">──▶ Penalized for verbosity (41 words)</text>

    <rect x="1195" y="458" width="260" height="24" fill="#DCFCE7" rx="4"/>
    <text x="1325" y="474" text-anchor="middle" font-size="8.5" font-weight="700" fill="#065F46">Sub-millisecond latency | High precision</text>
  </g>
</svg>