<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="270" fill="#F8FAFC" rx="14"/>
  <rect x="1" y="1" width="998" height="268" fill="none" stroke="#E2E8F0" stroke-width="2" rx="14"/>

  <!-- Diagram Header -->
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Information Retrieval: The Two-Stage Funnel</text>
  <text x="500" y="48" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Pruning Millions to Relevant Candidates (&lt; 2ms) Before Expensive Scoring</text>

  <!-- Card 1: User Search Query -->
  <g filter="url(#shadow)">
    <rect x="30" y="68" width="180" height="145" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" rx="10"/>
    <rect x="30" y="68" width="180" height="32" fill="#F1F5F9" rx="10"/>
    <path d="M 30 90 H 210 V 100 H 30 Z" fill="#F1F5F9"/>
    <text x="42" y="89" font-size="12" font-weight="700" fill="#1E293B">User Query</text>
    <rect x="150" y="74" width="50" height="18" fill="#E2E8F0" rx="4"/>
    <text x="175" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Online</text>

    <text x="42" y="118" font-size="10" font-weight="600" fill="#334155">Search String:</text>
    <rect x="42" y="126" width="156" height="26" fill="#FFFFFF" stroke="#CBD5E1" rx="5"/>
    <text x="52" y="143" font-size="10.5" font-family="monospace" font-weight="700" fill="#2563EB">"distributed cache"</text>
    <text x="42" y="172" font-size="9" fill="#64748B">• Multi-term Boolean</text>
    <text x="42" y="188" font-size="9" fill="#64748B">• Sub-millisecond target</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 210 141 L 255 141" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 210 141 L 250 141" class="base-line flow-blue"/>
  <text x="232" y="133" text-anchor="middle" font-size="8.5" font-weight="600" fill="#2563EB">Query</text>

  <!-- Card 2: Stage 1: Candidate Retrieval -->
  <g filter="url(#shadow)">
    <rect x="260" y="68" width="240" height="145" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="260" y="68" width="240" height="32" fill="#DBEAFE" rx="10"/>
    <path d="M 260 90 H 500 V 100 H 260 Z" fill="#DBEAFE"/>
    <text x="272" y="89" font-size="12" font-weight="700" fill="#1E40AF">1. Candidate Retrieval</text>
    <rect x="435" y="74" width="55" height="18" fill="#2563EB" rx="4"/>
    <text x="462" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">&lt; 2ms</text>

    <text x="272" y="118" font-size="10" font-weight="700" fill="#1E3A8A">Inverted Index Lookups</text>
    <text x="272" y="134" font-size="9" fill="#334155">• Speed &amp; Recall filtering</text>
    <text x="272" y="149" font-size="9" fill="#334155">• Prunes corpus: 1M ──▶ ~500 docs</text>
    <rect x="272" y="162" width="216" height="24" fill="#FFFFFF" stroke="#3B82F6" rx="5"/>
    <text x="380" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#1D4ED8">Candidates: [Doc 1, Doc 3, ...]</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 500 141 L 545 141" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 500 141 L 540 141" class="base-line flow-blue"/>
  <text x="522" y="133" text-anchor="middle" font-size="8" font-weight="600" fill="#2563EB">Candidates</text>

  <!-- Card 3: Stage 2: Relevance Ranking -->
  <g filter="url(#shadow)">
    <rect x="550" y="68" width="230" height="145" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="550" y="68" width="230" height="32" fill="#DBEAFE" rx="10"/>
    <path d="M 550 90 H 780 V 100 H 550 Z" fill="#DBEAFE"/>
    <text x="562" y="89" font-size="12" font-weight="700" fill="#1E40AF">2. Relevance Ranking</text>
    <rect x="715" y="74" width="55" height="18" fill="#2563EB" rx="4"/>
    <text x="742" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Quality</text>

    <text x="562" y="118" font-size="10" font-weight="700" fill="#1E3A8A">BM25 Scoring Engine</text>
    <text x="562" y="134" font-size="9" fill="#334155">• Precision &amp; Quality ranking</text>
    <text x="562" y="149" font-size="9" fill="#334155">• Term Saturation (k1) &amp; Length Norm (b)</text>
    <rect x="562" y="162" width="206" height="24" fill="#FFFFFF" stroke="#3B82F6" rx="5"/>
    <text x="665" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#1D4ED8">Sorts by Score ──▶</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 780 141 L 825 141" class="base-line" stroke="#86EFAC" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 780 141 L 820 141" class="base-line flow-green"/>
  <text x="802" y="133" text-anchor="middle" font-size="8.5" font-weight="700" fill="#059669">Top-K</text>

  <!-- Card 4: Top-K Results -->
  <g filter="url(#shadow)">
    <rect x="830" y="68" width="140" height="145" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="830" y="68" width="140" height="32" fill="#DCFCE7" rx="10"/>
    <path d="M 830 90 H 970 V 100 H 830 Z" fill="#DCFCE7"/>
    <text x="842" y="89" font-size="12" font-weight="700" fill="#065F46">Top-K Results</text>

    <text x="842" y="118" font-size="9.5" font-weight="700" fill="#065F46">1. Doc 1 [Best]</text>
    <text x="842" y="136" font-size="9.5" font-weight="600" fill="#047857">2. Doc 3</text>
    <text x="842" y="154" font-size="9.5" font-weight="600" fill="#047857">3. Doc 9</text>
    <rect x="838" y="168" width="124" height="22" fill="#DCFCE7" rx="4"/>
    <text x="900" y="183" text-anchor="middle" font-size="8" font-weight="700" fill="#065F46">Output to User</text>
  </g>

  <!-- Bottom Principle Bar -->
  <rect x="30" y="226" width="940" height="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="500" y="243" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">Architectural Principle: Fast Boolean filtering prunes the corpus (&lt; 2ms); expensive statistical scoring only runs on relevant candidates.</text>
</svg>