<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 260" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .flow-green {
        stroke: #059669;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="260" fill="#F8FAFC" rx="14"/>
  <rect x="1" y="1" width="1078" height="258" fill="none" stroke="#E2E8F0" stroke-width="2" rx="14"/>

  <!-- Diagram Header -->
  <text x="540" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Text Analysis &amp; Normalization Pipeline</text>
  <text x="540" y="48" text-anchor="middle" font-size="11" font-weight="500" fill="#64748B">Transforming Unstructured Natural Text into Normalized Search Vocabulary</text>

  <!-- Card 0: Raw Input String -->
  <g filter="url(#shadow)">
    <rect x="30" y="68" width="170" height="145" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" rx="10"/>
    <rect x="30" y="68" width="170" height="32" fill="#F1F5F9" rx="10"/>
    <path d="M 30 90 H 200 V 100 H 30 Z" fill="#F1F5F9"/>
    <text x="42" y="89" font-size="12" font-weight="700" fill="#1E293B">Raw String</text>
    <rect x="140" y="74" width="50" height="18" fill="#E2E8F0" rx="4"/>
    <text x="165" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Input</text>

    <text x="42" y="118" font-size="9.5" font-weight="600" fill="#334155">Source Document / Query:</text>
    <rect x="38" y="126" width="154" height="34" fill="#FFFFFF" stroke="#CBD5E1" rx="5"/>
    <text x="45" y="142" font-size="9.5" font-family="monospace" font-weight="700" fill="#2563EB">"Redis &amp; Raft:</text>
    <text x="45" y="154" font-size="9.5" font-family="monospace" font-weight="700" fill="#2563EB"> Fast Caching!"</text>
    <text x="42" y="180" font-size="8.5" fill="#64748B">• Raw characters</text>
    <text x="42" y="195" font-size="8.5" fill="#64748B">• Punctuation &amp; casing</text>
  </g>

  <!-- Connector 0 -> 1 -->
  <path d="M 200 141 L 230 141" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 200 141 L 225 141" class="base-line flow-blue"/>
  <text x="215" y="133" text-anchor="middle" font-size="8" font-weight="600" fill="#2563EB">Text</text>

  <!-- Card 1: 1. Tokenization -->
  <g filter="url(#shadow)">
    <rect x="235" y="68" width="190" height="145" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="235" y="68" width="190" height="32" fill="#DBEAFE" rx="10"/>
    <path d="M 235 90 H 425 V 100 H 235 Z" fill="#DBEAFE"/>
    <text x="247" y="89" font-size="12" font-weight="700" fill="#1E40AF">1. Tokenization</text>
    <rect x="355" y="74" width="60" height="18" fill="#2563EB" rx="4"/>
    <text x="385" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Word Split</text>

    <text x="247" y="118" font-size="9.5" font-weight="700" fill="#1E3A8A">Regex Word Boundaries</text>
    <text x="247" y="133" font-size="8.8" fill="#334155">• Drops symbols (&amp;, !)</text>
    <rect x="243" y="145" width="174" height="48" fill="#FFFFFF" stroke="#3B82F6" rx="5"/>
    <text x="250" y="162" font-size="9" font-family="monospace" font-weight="700" fill="#1D4ED8">['Redis', 'Raft',</text>
    <text x="250" y="178" font-size="9" font-family="monospace" font-weight="700" fill="#1D4ED8"> 'Fast', 'Caching']</text>
    <text x="247" y="204" font-size="8" fill="#64748B">Boundary regex matching</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 425 141 L 455 141" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 425 141 L 450 141" class="base-line flow-blue"/>
  <text x="440" y="133" text-anchor="middle" font-size="8" font-weight="600" fill="#2563EB">Tokens</text>

  <!-- Card 2: 2. Case Folding -->
  <g filter="url(#shadow)">
    <rect x="460" y="68" width="185" height="145" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="460" y="68" width="185" height="32" fill="#DBEAFE" rx="10"/>
    <path d="M 460 90 H 645 V 100 H 460 Z" fill="#DBEAFE"/>
    <text x="472" y="89" font-size="12" font-weight="700" fill="#1E40AF">2. Case Folding</text>
    <rect x="585" y="74" width="50" height="18" fill="#2563EB" rx="4"/>
    <text x="610" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Lower</text>

    <text x="472" y="118" font-size="9.5" font-weight="700" fill="#1E3A8A">Normalize Lettercase</text>
    <text x="472" y="133" font-size="8.8" fill="#334155">• "Redis" ──▶ "redis"</text>
    <rect x="468" y="145" width="169" height="48" fill="#FFFFFF" stroke="#3B82F6" rx="5"/>
    <text x="475" y="162" font-size="9" font-family="monospace" font-weight="700" fill="#1D4ED8">['redis', 'raft',</text>
    <text x="475" y="178" font-size="9" font-family="monospace" font-weight="700" fill="#1D4ED8"> 'fast', 'caching']</text>
    <text x="472" y="204" font-size="8" fill="#64748B">Guarantees case-insensitivity</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 645 141 L 675 141" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 645 141 L 670 141" class="base-line flow-blue"/>
  <text x="660" y="133" text-anchor="middle" font-size="8" font-weight="600" fill="#2563EB">Lower</text>

  <!-- Card 3: 3. Stop Word Removal -->
  <g filter="url(#shadow)">
    <rect x="680" y="68" width="185" height="145" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" rx="10"/>
    <rect x="680" y="68" width="185" height="32" fill="#DBEAFE" rx="10"/>
    <path d="M 680 90 H 865 V 100 H 680 Z" fill="#DBEAFE"/>
    <text x="692" y="89" font-size="12" font-weight="700" fill="#1E40AF">3. Stop Words</text>
    <rect x="805" y="74" width="50" height="18" fill="#2563EB" rx="4"/>
    <text x="830" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Filter</text>

    <text x="692" y="118" font-size="9.5" font-weight="700" fill="#1E3A8A">Filter Grammatical Noise</text>
    <text x="692" y="133" font-size="8.8" fill="#334155">• Drops {"the", "is", "at"}</text>
    <rect x="688" y="145" width="169" height="48" fill="#FFFFFF" stroke="#3B82F6" rx="5"/>
    <text x="695" y="162" font-size="9" font-family="monospace" font-weight="700" fill="#1D4ED8">['redis', 'raft',</text>
    <text x="695" y="178" font-size="9" font-family="monospace" font-weight="700" fill="#1D4ED8"> 'fast', 'caching']</text>
    <text x="692" y="204" font-size="8" fill="#64748B">Preserves informational terms</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 865 141 L 895 141" class="base-line" stroke="#86EFAC" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M 865 141 L 890 141" class="base-line flow-green"/>
  <text x="880" y="133" text-anchor="middle" font-size="8.5" font-weight="700" fill="#059669">Clean</text>

  <!-- Card 4: Clean Terms Output -->
  <g filter="url(#shadow)">
    <rect x="900" y="68" width="150" height="145" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="900" y="68" width="150" height="32" fill="#DCFCE7" rx="10"/>
    <path d="M 900 90 H 1050 V 100 H 900 Z" fill="#DCFCE7"/>
    <text x="912" y="89" font-size="12" font-weight="700" fill="#065F46">Vocabulary</text>
    <rect x="995" y="74" width="45" height="18" fill="#059669" rx="4"/>
    <text x="1017" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Target</text>

    <text x="912" y="118" font-size="9" font-weight="700" fill="#065F46">• "redis"</text>
    <text x="912" y="134" font-size="9" font-weight="700" fill="#065F46">• "raft"</text>
    <text x="912" y="150" font-size="9" font-weight="700" fill="#065F46">• "fast"</text>
    <text x="912" y="166" font-size="9" font-weight="700" fill="#065F46">• "caching"</text>
    <rect x="908" y="178" width="134" height="22" fill="#DCFCE7" rx="4"/>
    <text x="975" y="193" text-anchor="middle" font-size="8.5" font-weight="700" fill="#065F46">Ready for Indexing</text>
  </g>

  <!-- Bottom Principle Bar -->
  <rect x="30" y="226" width="1020" height="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="540" y="243" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">The Iron Rule: Documents and queries MUST pass through this exact same pipeline in analyzer.py to ensure vocabulary parity.</text>
</svg>