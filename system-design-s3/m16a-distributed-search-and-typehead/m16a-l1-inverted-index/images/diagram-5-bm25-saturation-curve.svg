<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-blue {
        stroke: #2563EB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flow 1s linear infinite;
      }
      .base-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="310" fill="#F8FAFC" rx="14"/>
  <rect x="1" y="1" width="918" height="308" fill="none" stroke="#E2E8F0" stroke-width="2" rx="14"/>

  <!-- Diagram Header -->
  <text x="460" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Term Frequency Relevance Curve</text>

  <!-- Outer Subgraph Container -->
  <rect x="35" y="55" width="850" height="230" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" rx="12"/>
  <rect x="50" y="44" width="240" height="22" fill="#2563EB" rx="6"/>
  <text x="170" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Comparison: Relevance Curves</text>

  <!-- Card 1: Linear TF (Classic TF-IDF) -->
  <g filter="url(#shadow)">
    <rect x="55" y="85" width="350" height="180" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" rx="10"/>
    <rect x="55" y="85" width="350" height="34" fill="#F1F5F9" rx="10"/>
    <path d="M 55 109 H 405 V 119 H 55 Z" fill="#F1F5F9"/>
    <text x="70" y="107" font-size="12.5" font-weight="700" fill="#1E293B">Linear TF (Classic TF-IDF)</text>
    <rect x="320" y="92" width="70" height="18" fill="#E2E8F0" rx="4"/>
    <text x="355" y="105" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Unbounded</text>

    <text x="70" y="137" font-size="10" fill="#334155">• Score increases endlessly with every mention.</text>
    <text x="70" y="157" font-size="10" fill="#334155">• 20 mentions = 20x the score.</text>
    <text x="70" y="177" font-size="10" fill="#334155">• Highly vulnerable to keyword stuffing &amp; verbosity.</text>

    <rect x="70" y="200" width="320" height="28" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" rx="5"/>
    <text x="230" y="218" text-anchor="middle" font-size="9" font-weight="700" fill="#2563EB">Vulnerable to Word-Count Manipulation</text>
  </g>

  <!-- Connector: Linear -. Contrasted With .-> BM25Curve -->
  <path d="M 405 175 L 510 175" class="base-line" stroke="#BFDBFE" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 405 175 L 505 175" class="base-line flow-blue"/>
  <g>
    <rect x="415" y="153" width="90" height="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" rx="4"/>
    <text x="460" y="168" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1E40AF">Contrasted With</text>
  </g>

  <!-- Card 2: Okapi BM25 Curve -->
  <g filter="url(#shadow)">
    <rect x="515" y="85" width="350" height="180" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" rx="10"/>
    <rect x="515" y="85" width="350" height="34" fill="#DCFCE7" rx="10"/>
    <path d="M 515 109 H 865 V 119 H 515 Z" fill="#DCFCE7"/>
    <text x="530" y="107" font-size="12.5" font-weight="700" fill="#065F46">Okapi BM25 Curve (k1=1.2, b=0.75)</text>
    <rect x="785" y="92" width="65" height="18" fill="#059669" rx="4"/>
    <text x="817" y="105" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Controlled</text>

    <text x="530" y="132" font-size="9.5" fill="#14532D">• Score rises rapidly for initial mentions (1 to 3).</text>
    <text x="530" y="150" font-size="9.5" fill="#14532D">• Mentions 4+ face diminishing returns.</text>
    <text x="530" y="168" font-size="9.5" fill="#14532D">• Score asymptotically levels off.</text>
    <text x="530" y="186" font-size="9.5" fill="#14532D">• Heavily penalizes long, rambling documents.</text>

    <rect x="530" y="200" width="320" height="28" fill="#DCFCE7" rx="5"/>
    <text x="690" y="218" text-anchor="middle" font-size="9" font-weight="700" fill="#065F46">Asymptotic Saturation + Length Normalization</text>
  </g>
</svg>